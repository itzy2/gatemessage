<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16005c">
<title>GATE MESSAGE</title>

<!-- GATE MESSAGE 公式サイトアイコン -->
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="shortcut icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./favicon.png">
<meta name="application-name" content="GATE MESSAGE">
<meta name="apple-mobile-web-app-title" content="GATE MESSAGE">
<meta name="msapplication-TileColor" content="#16005c">
<link rel="manifest" href="./manifest.webmanifest">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
:root {
  --blue:#168cff;
  --blue-dark:#0872dc;
  --bg:#f3f6fb;
  --panel:#ffffff;
  --text:#172033;
  --muted:#8994a7;
  --line:#e5eaf1;
  --bubble:#ffffff;
  --mine:#168cff;
  --danger:#e34d59;
  --success:#21a66b;
}
body.dark {
  --bg:#101725;
  --panel:#192437;
  --text:#edf4ff;
  --muted:#9baac0;
  --line:#2b3b52;
  --bubble:#24334a;
}
* {
  box-sizing:border-box;
}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,"Noto Sans JP",sans-serif;
}
button,input,textarea {
  font:inherit;
}
button {
  cursor:pointer;
}
.hidden {
  display:none!important;
}
button:disabled {
  opacity:.5;
  cursor:not-allowed;
}

/* ログイン */
#loginScreen {
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(140deg,#06162d,#087cff);
}
.login-card {
  width:100%;
  max-width:420px;
  background:#fff;
  color:#172033;
  padding:30px;
  border-radius:22px;
  box-shadow:0 15px 60px #001b4540;
}
.logo-area {
  display:flex;
  align-items:center;
  gap:10px;
}
.logo {
  font-size:25px;
  font-weight:900;
  letter-spacing:1px;
}
.logo span {
  color:#168cff;
}
.torii {
  width:42px;
  height:42px;
}
.login-description {
  color:#8994a7;
  font-size:13px;
  margin:12px 0 22px;
}
.field {
  width:100%;
  padding:14px;
  border:1px solid #e5eaf1;
  border-radius:11px;
  margin:7px 0;
  outline:none;
}
.field:focus {
  border-color:#168cff;
}
.primary {
  background:#168cff;
  color:#fff;
  border:0;
  padding:13px;
  border-radius:11px;
  font-weight:bold;
  width:100%;
  margin-top:10px;
}
.primary:hover {
  background:#0872dc;
}
.secondary {
  background:#e8f2ff;
  color:#087cff;
  border:0;
  padding:10px 13px;
  border-radius:10px;
}
.danger {
  background:#ffe9e9;
  color:#d22;
  border:0;
  padding:10px 13px;
  border-radius:10px;
}
.link-button {
  border:0;
  background:none;
  color:#087cff;
  padding:13px 5px;
  width:100%;
}
#authMessage {
  font-size:12px;
  color:#d33;
  min-height:20px;
  overflow-wrap:anywhere;
}

/* メイン画面 */
#app {
  max-width:1500px;
  margin:auto;
  height:100dvh;
  display:flex;
  background:var(--panel);
  overflow:hidden;
}
.sidebar {
  width:350px;
  min-width:290px;
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  background:var(--panel);
}
.sidebar-top {
  padding:16px;
  border-bottom:1px solid var(--line);
}
.topline {
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.search {
  width:100%;
  padding:12px;
  border:0;
  background:var(--bg);
  color:var(--text);
  border-radius:11px;
  margin-top:14px;
  outline:none;
}
.tabs {
  display:flex;
  gap:15px;
  margin-top:14px;
  font-size:13px;
  color:var(--muted);
  flex-wrap:wrap;
}
.tabs button {
  border:0;
  background:none;
  color:inherit;
  padding:3px 0;
}
.tabs button.active {
  color:var(--blue);
  font-weight:bold;
}
#chatList {
  overflow:auto;
  flex:1;
}
.chat-item {
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px 14px;
  cursor:pointer;
  border-bottom:1px solid var(--line);
}
.chat-item:hover {
  background:var(--bg);
}
.chat-item.selected {
  background:var(--bg);
}
.avatar {
  width:45px;
  height:45px;
  flex-shrink:0;
  border-radius:50%;
  background:#dceaff;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#087cff;
  font-weight:bold;
  font-size:18px;
  overflow:hidden;
}
.avatar img {
  width:100%;
  height:100%;
  object-fit:cover;
}
.chat-info {
  flex:1;
  min-width:0;
}
.chat-name {
  font-weight:bold;
  font-size:14px;
}
.chat-preview {
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.chat-time {
  font-size:10px;
  color:var(--muted);
}
.my-account {
  padding:12px;
  border-top:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:9px;
}
.my-account-info {
  flex:1;
  min-width:0;
}
.my-account-name {
  font-weight:bold;
  font-size:13px;
}
.my-account-caption {
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

/* チャット */
.main {
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
  background:var(--panel);
}
.chat-header {
  min-height:70px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  padding:0 15px;
  gap:10px;
}
.chat-header-info {
  flex:1;
  min-width:0;
}
.chat-header-name {
  font-weight:bold;
}
.chat-status {
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
}
.icon-button {
  border:0;
  background:transparent;
  font-size:20px;
  padding:8px;
  color:var(--muted);
  border-radius:10px;
}
.icon-button:hover {
  background:var(--bg);
}
#messages {
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:12px;
  background:var(--bg);
}
.message-row {
  display:flex;
  flex-direction:column;
  max-width:78%;
  align-items:flex-start;
}
.message-row.mine {
  align-self:flex-end;
  align-items:flex-end;
}
.bubble {
  background:var(--bubble);
  padding:11px 14px;
  border-radius:16px;
  box-shadow:0 1px 4px #0000000a;
  font-size:14px;
  line-height:1.6;
  overflow-wrap:anywhere;
}
.message-row.mine .bubble {
  background:var(--mine);
  color:white;
  border-bottom-right-radius:5px;
}
.bubble img,
.bubble video {
  display:block;
  max-width:100%;
  max-height:340px;
  border-radius:12px;
}
.sticker-message {
  font-size:55px;
  padding:7px;
}
.message-meta {
  font-size:10px;
  color:var(--muted);
  margin-top:4px;
}
.message-actions {
  display:flex;
  gap:4px;
  flex-wrap:wrap;
  margin-top:4px;
}
.message-actions button {
  border:0;
  background:var(--bg);
  color:var(--muted);
  border-radius:8px;
  padding:5px 8px;
  font-size:11px;
}
.composer {
  border-top:1px solid var(--line);
  padding:11px 15px 15px;
  background:var(--panel);
}
.composer-tools {
  display:flex;
  gap:7px;
  margin-bottom:9px;
  flex-wrap:wrap;
}
.tool-button {
  border:0;
  background:var(--bg);
  color:var(--text);
  border-radius:9px;
  padding:8px 10px;
  font-size:13px;
}
.send-line {
  display:flex;
  align-items:center;
  gap:9px;
}
#messageInput {
  flex:1;
  border:0;
  background:var(--bg);
  color:var(--text);
  border-radius:22px;
  padding:13px 16px;
  outline:none;
  min-width:0;
}
.send-button {
  background:var(--blue);
  color:white;
  border:0;
  border-radius:50%;
  width:44px;
  height:44px;
  font-size:18px;
}
.empty {
  margin:auto;
  text-align:center;
  color:var(--muted);
  padding:25px;
}
#mobileBack {
  display:none;
}

/* メニュー・モーダル */
#userPanel {
  position:fixed;
  right:18px;
  top:65px;
  background:var(--panel);
  padding:10px;
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:0 10px 30px #0002;
  z-index:20;
  min-width:230px;
  max-height:80vh;
  overflow:auto;
}
.menu-button {
  display:block;
  width:100%;
  padding:11px;
  text-align:left;
  border:0;
  background:transparent;
  color:var(--text);
  border-radius:8px;
  font-size:13px;
}
.menu-button:hover {
  background:var(--bg);
}
#notice {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#172033;
  color:white;
  padding:12px 18px;
  border-radius:12px;
  z-index:80;
  font-size:13px;
  max-width:90%;
  display:none;
  overflow-wrap:anywhere;
}
.modal {
  position:fixed;
  inset:0;
  background:#0008;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}
.modal-card {
  background:var(--panel);
  color:var(--text);
  border-radius:18px;
  padding:22px;
  width:100%;
  max-width:460px;
  max-height:85vh;
  overflow:auto;
}
.modal-card h3 {
  margin-top:0;
}
.modal-card input,
.modal-card textarea {
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--bg);
  color:var(--text);
  margin:7px 0;
}
.modal-actions {
  display:flex;
  gap:8px;
  margin-top:12px;
}
.modal-actions button {
  flex:1;
}
.friend-code {
  font-size:22px;
  font-weight:bold;
  letter-spacing:3px;
  text-align:center;
  padding:12px;
  color:var(--blue);
}
#qrCode {
  display:flex;
  justify-content:center;
  padding:15px;
}
.online-dot {
  display:inline-block;
  width:8px;
  height:8px;
  background:#25bd70;
  border-radius:50%;
  margin-right:5px;
}
.context-menu {
  position:fixed;
  z-index:70;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:7px;
  box-shadow:0 8px 30px #0003;
  min-width:190px;
}
.context-menu button {
  display:block;
  width:100%;
  text-align:left;
  padding:11px;
  border:0;
  background:transparent;
  color:var(--text);
  border-radius:7px;
}

/* スタンプ */
#stickerPanel {
  padding:8px 0;
}
#stickerGrid {
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:7px;
}
#stickerGrid button {
  font-size:26px;
  border:0;
  padding:8px;
  background:var(--bg);
  border-radius:8px;
}

/* モバイル */
@media(max-width:700px) {
  #app {
    height:100dvh;
  }
  .sidebar {
    width:100%;
    min-width:0;
    border:0;
  }
  .main {
    display:none;
    width:100%;
  }
  #app.in-chat .sidebar {
    display:none;
  }
  #app.in-chat .main {
    display:flex;
  }
  #mobileBack {
    display:block;
  }
  .chat-header {
    min-height:64px;
    padding:0 8px;
  }
  #messages {
    padding:13px;
  }
  .message-row {
    max-width:88%;
  }
  .composer {
    padding:9px;
  }
  .sidebar-top {
    padding:13px;
  }
}


/* 1対1 通話画面 */
.call-overlay{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(4,10,28,.9);color:#fff}
.call-card{width:100%;max-width:620px;border:1px solid #ffffff30;border-radius:22px;padding:22px;background:linear-gradient(145deg,#17264a,#07152f);box-shadow:0 20px 70px #0008;text-align:center}
.call-title{font-size:20px;font-weight:800;margin-bottom:7px}.call-subtitle{color:#c3d3f2;font-size:13px;margin-bottom:18px}
.call-video-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.call-video-grid video{width:100%;min-height:150px;max-height:340px;object-fit:cover;background:#020817;border-radius:14px}
.call-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.call-actions button{border:0;border-radius:12px;padding:12px 16px;color:#fff;background:#247fe8;font-weight:700;min-width:92px}.call-actions .call-danger{background:#df4054}.call-actions .call-muted{background:#52627c}.call-avatar{font-size:52px;margin:16px 0}
@media(max-width:520px){.call-card{padding:16px}.call-video-grid{grid-template-columns:1fr}.call-video-grid video{min-height:120px;max-height:230px}}

</style>
</head>

<body>

<!-- ログイン画面 -->
<section id="loginScreen">
  <div class="login-card">

    <div class="logo-area">
      <svg class="torii" viewBox="0 0 100 100" fill="none"
           stroke="#168cff" stroke-width="7" stroke-linecap="round">
        <path d="M12 25 Q50 12 88 25"/>
        <path d="M20 34 H80"/>
        <path d="M28 34 V85"/>
        <path d="M72 34 V85"/>
        <path d="M20 48 H80"/>
      </svg>
      <div class="logo">GATE <span>MESSAGE</span></div>
    </div>

    <div class="login-description">
      Connect with everyone.
    </div>

    <div id="loginForm">
      <input id="loginEmail" class="field"
             type="email" placeholder="メールアドレス">
      <input id="loginPassword" class="field"
             type="password" placeholder="パスワード">
      <button class="primary" onclick="login()">ログイン</button>
      <button class="link-button" onclick="showSignup()">
        新規登録はこちら
      </button>
    </div>

    <div id="signupForm" class="hidden">
      <input id="signupName" class="field"
             placeholder="表示名" maxlength="40">
      <input id="signupEmail" class="field"
             type="email" placeholder="メールアドレス">
      <input id="signupPassword" class="field"
             type="password" placeholder="パスワード（6文字以上）">
      <input id="signupPasswordConfirm" class="field"
             type="password" placeholder="パスワード（確認）">
      <button class="primary" onclick="signup()">
        アカウントを新規登録
      </button>
      <button class="link-button" onclick="showLogin()">
        ログインに戻る
      </button>
    </div>

    <p id="authMessage"></p>
  </div>
</section>

<!-- アプリ本体 -->
<div id="app" class="hidden">

  <aside class="sidebar">

    <div class="sidebar-top">
      <div class="topline">
        <div class="logo">GATE <span>MESSAGE</span></div>
        <button class="icon-button" onclick="showFriendCode()">＋</button>
      </div>

      <input id="searchInput" class="search"
             placeholder="チャットを検索">

      <div class="tabs">
        <button id="tabChats" class="active" onclick="showChats()">チャット</button>
        <button id="tabFriends" onclick="showFriends()">友だち</button>
        <button onclick="showHiddenChats()">非表示</button>
        <button onclick="showFriendCode()">友だち追加 ＋</button>
      </div>
    </div>

    <div id="chatList"></div>

    <div class="my-account">
      <div class="avatar" id="myAvatar">G</div>
      <div class="my-account-info">
        <div class="my-account-name" id="myName">ユーザー</div>
        <div class="my-account-caption">GATE MESSAGE</div>
      </div>
      <button class="icon-button" onclick="toggleMenu()">⚙</button>
    </div>

  </aside>

  <main class="main">

    <header class="chat-header">
      <button id="mobileBack" class="icon-button"
              onclick="backToList()">‹</button>

      <div class="avatar" id="peerAvatar">G</div>

      <div class="chat-header-info">
        <div class="chat-header-name" id="peerName">チャット</div>
        <div class="chat-status" id="peerStatus">GATE MESSAGE</div>
      </div>

      <button class="icon-button" onclick="startCall('audio')" title="音声通話">☎</button>
      <button class="icon-button" onclick="startCall('video')" title="ビデオ通話">▣</button>
      <button class="icon-button" onclick="toggleMenu()">⋯</button>
    </header>

    <div id="messages">
      <div class="empty">会話を選択してください</div>
    </div>

    <div class="composer">

      <div class="composer-tools">
        <button class="tool-button"
                onclick="document.getElementById('photoFile').click()">
          📷 写真
        </button>
        <button class="tool-button"
                onclick="document.getElementById('videoFile').click()">
          🎥 動画
        </button>
        <button class="tool-button" onclick="toggleStickers()">
          😊 スタンプ
        </button>
      </div>

      <div id="stickerPanel" class="hidden">
        <div id="stickerGrid"></div>
      </div>

      <div class="send-line">
        <input id="messageInput" placeholder="メッセージを入力...">
        <button class="send-button" onclick="sendMessage()">➤</button>
      </div>

      <input id="photoFile" type="file" accept="image/*" multiple hidden>
      <input id="videoFile" type="file"
             accept="video/mp4,video/webm" multiple hidden>
    </div>

  </main>
</div>

<!-- 設定メニュー -->
<div id="userPanel" class="hidden">
  <button class="menu-button" onclick="editProfile()">プロフィール編集</button>
  <button class="menu-button" onclick="uploadAvatar()">プロフィール画像変更</button>
  <button class="menu-button" onclick="showFriendCode()">友だちコード・QR</button>
  <button class="menu-button" onclick="createGroup()">グループ作成</button>
  <button class="menu-button" onclick="showGroupMembers()">グループメンバー</button>
  <button class="menu-button" onclick="leaveGroup()">グループ退出</button>
  <button class="menu-button" onclick="hideConversation()">チャットを非表示</button>
  <button class="menu-button" onclick="deleteConversation()">自分の一覧から削除</button>
  <button class="menu-button" onclick="toggleBlock()">ブロック・解除</button>
  <button class="menu-button" onclick="reportUser()">ユーザーを通報</button>
  <button class="menu-button" id="installAppButton" onclick="installApp()">アプリとしてインストール</button>
  <button class="menu-button" onclick="toggleTheme()">白・黒テーマ切替</button>
  <button class="menu-button" onclick="logout()">ログアウト</button>
  <button class="menu-button" onclick="toggleMenu()">閉じる</button>
</div>

<!-- モーダル -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <h3 id="modalTitle">確認</h3>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button class="secondary" onclick="closeModal()">閉じる</button>
    </div>
  </div>
</div>


<!-- 1対1 音声・ビデオ通話画面 -->
<div id="callOverlay" class="call-overlay hidden" aria-live="polite">
  <div class="call-card">
    <div class="call-title" id="callTitle">GATE MESSAGE 通話</div>
    <div class="call-subtitle" id="callSubtitle">接続しています...</div>
    <div id="callAvatar" class="call-avatar">☎</div>
    <div id="callVideoGrid" class="call-video-grid hidden">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div class="call-actions" id="incomingCallActions">
      <button onclick="acceptCall()">応答</button>
      <button class="call-danger" onclick="rejectCall()">拒否</button>
    </div>
    <div class="call-actions hidden" id="activeCallActions">
      <button id="muteButton" class="call-muted" onclick="toggleCallMute()">マイクOFF</button>
      <button id="cameraButton" class="call-muted" onclick="toggleCallCamera()">カメラOFF</button>
      <button class="call-danger" onclick="endCall()">通話終了</button>
    </div>
  </div>
</div>

<div id="notice"></div>
<div id="contextMenu" class="context-menu hidden"></div>

<script>
"use strict";

/* =====================================================
   Supabase接続設定
===================================================== */

const SUPABASE_URL =
  "https://hxrtpftlklgwesvanlpk.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_b1tG9o1bXMzZBXGHBJZhZA_Ak-KYmnZ";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const $ = id => document.getElementById(id);

let me = null;
let current = null;
let peer = null;

let conversations = [];
let friends = [];
let blockedUsers = new Set();

/* =====================================================
   共通処理
===================================================== */

function notice(message) {
  $("notice").textContent = message;
  $("notice").style.display = "block";

  clearTimeout(notice.timer);

  notice.timer = setTimeout(() => {
    $("notice").style.display = "none";
  }, 3500);
}

function callNotice(message) {
  notice(message);
}

function safe(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}

function avatar(name, url) {
  if (url) {
    return '<img src="' + safe(url) + '" alt="">';
  }

  return safe(
    (name || "G").trim().charAt(0).toUpperCase()
  );
}

function closeModal() {
  $("modal").classList.add("hidden");
}

function showModal(title, html) {
  $("modalTitle").textContent = title;
  $("modalBody").innerHTML = html;
  $("modal").classList.remove("hidden");
}

function toggleMenu() {

function toggleTheme() {
  document.body.classList.toggle("dark");

  localStorage.setItem(
    "gm_theme",
    document.body.classList.contains("dark") ? "dark" : "light"
  );
}

if (localStorage.getItem("gm_theme") === "dark") {

/* =====================================================
   ログイン・新規登録
===================================================== */

function showLogin() {
  $("loginForm").classList.remove("hidden");
  $("signupForm").classList.add("hidden");
  $("authMessage").textContent = "";
  $("authMessage").style.color = "#d33";
}

function showSignup() {
  $("loginForm").classList.add("hidden");
  $("signupForm").classList.remove("hidden");
  $("authMessage").textContent = "";
  $("authMessage").style.color = "#d33";
}

async function login() {
  const email = $("loginEmail").value.trim();
  const password = $("loginPassword").value;

  $("authMessage").textContent = "";

  if (!email || !password) {
    $("authMessage").textContent =
      "メールアドレスとパスワードを入力してください";
    return;
  }

  const { data, error } = await db.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    $("authMessage").textContent =
      "ログインエラー: " + error.message;
    return;
  }

  await startApp(data.user);
}

async function signup() {
  const name = $("signupName").value.trim();
  const email = $("signupEmail").value.trim();
  const password = $("signupPassword").value;
  const passwordConfirm = $("signupPasswordConfirm").value;

  $("authMessage").textContent = "";

  if (!name || !email || !password) {
    $("authMessage").textContent =
      "すべての項目を入力してください";
    return;
  }

  if (password.length < 6) {
    $("authMessage").textContent =
      "パスワードは6文字以上にしてください";
    return;
  }

  if (password !== passwordConfirm) {
    $("authMessage").textContent =
      "パスワードが一致しません";
    return;
  }

  const { data, error } = await db.auth.signUp({
    email,
    password,
    options: {
      data: {
        display_name: name
      }
    }
  });

  if (error) {
    $("authMessage").textContent =
      "新規登録エラー: " + error.message;
    return;
  }

  if (data.session && data.user) {
    const { error: profileError } = await db
      .from("profiles")
      .upsert({
        id: data.user.id,
        display_name: name
      }, {
        onConflict: "id"
      });

    if (profileError) {
      $("authMessage").textContent =
        "登録後のプロフィール保存エラー: " +
        profileError.message;
      return;
    }

    await startApp(data.user);
    return;
  }

  $("authMessage").style.color = "#168a48";
  $("authMessage").textContent =
    "確認メールを送信しました。メール内のリンクを開いてからログインしてください。";

  showLogin();
}

/* =====================================================
   アプリ起動
===================================================== */

async function startApp(user) {
  me = user;

  const { data: profile, error } = await db
    .from("profiles")
    .select("id,display_name,avatar_url,bio,friend_code")
    .eq("id", me.id)
    .maybeSingle();

  if (error) {
    notice("プロフィール取得エラー: " + error.message);
    return;
  }

  if (!profile) {
    notice(
      "プロフィールが見つかりません。Supabaseのプロフィール自動作成設定を確認してください。"
    );
    return;
  }

  me.name =
    profile.display_name ||
    user.user_metadata?.display_name ||
    "ユーザー";

  me.avatar_url = profile.avatar_url || "";
  me.bio = profile.bio || "";
  me.friend_code = profile.friend_code || "";

  $("myName").textContent = me.name;
  $("myAvatar").innerHTML = avatar(me.name, me.avatar_url);

  $("loginScreen").classList.add("hidden");
  $("app").classList.remove("hidden");

  await loadBlocks();
  await loadFriends();
  await loadConversations();
  await updatePresence();

  startPresence();
  subscribeList();
  await subscribeIncomingCalls();
}

/* =====================================================
   友だち一覧
   profilesとの曖昧な外部キー結合を使わず、
   友だちIDとプロフィールを別々に取得する
===================================================== */

async function loadFriends() {
  const { data, error } = await db
    .from("gm_friends")
    .select("friend_id")
    .eq("user_id", me.id);

  if (error) {
    notice("友だち一覧エラー: " + error.message);
    friends = [];
    return;
  }

  const ids = (data || []).map(row => row.friend_id);

  if (!ids.length) {
    friends = [];
    return;
  }

  const { data: profiles, error: profileError } = await db
    .from("profiles")
    .select("id,display_name,avatar_url")
    .in("id", ids);

  if (profileError) {
    notice("友だちプロフィール取得エラー: " + profileError.message);
    friends = [];
    return;
  }

  const { data: hidden, error: hiddenError } = await db
    .from("gm_friend_hidden")
    .select("friend_id")
    .eq("user_id", me.id);

  if (hiddenError) {
    notice("友だち非表示情報エラー: " + hiddenError.message);
    friends = profiles || [];
    return;
  }

  const hiddenIds = new Set(
    (hidden || []).map(row => row.friend_id)
  );

  friends = (profiles || []).filter(
    profile => !hiddenIds.has(profile.id)
  );
}

/* =====================================================
   チャット一覧
===================================================== */

async function loadConversations() {
  const { data, error } = await db
    .from("gm_conversation_members")
    .select(
      "conversation_id,gm_conversations(id,conversation_type,title,created_at)"
    )
    .eq("user_id", me.id);

  if (error) {
    notice("チャット一覧エラー: " + error.message);
    return;
  }

  const rows = (data || [])
    .map(row => row.gm_conversations)
    .filter(Boolean);

  const ids = rows.map(row => row.id);

  if (!ids.length) {
    conversations = [];
    renderCurrentList();
    return;
  }

  const { data: members } = await db
    .from("gm_conversation_members")
    .select("conversation_id,user_id")
    .in("conversation_id", ids);

  const otherIds = [
    ...new Set(
      (members || [])
        .filter(row => row.user_id !== me.id)
        .map(row => row.user_id)
    )
  ];

  let profiles = [];

  if (otherIds.length) {
    const result = await db
      .from("profiles")
      .select("id,display_name,avatar_url")
      .in("id", otherIds);

    profiles = result.data || [];
  }

  const profileMap = new Map(
    profiles.map(profile => [profile.id, profile])
  );

  const { data: messages } = await db
    .from("gm_messages")
    .select(
      "id,conversation_id,content,message_type,created_at,sender_id,deleted_at"
    )
    .in("conversation_id", ids)
    .order("created_at", { ascending: false });

  const { data: hidden } = await db
    .from("gm_conversation_hidden")
    .select("conversation_id")
    .eq("user_id", me.id);

  const hiddenIds = new Set(
    (hidden || []).map(row => row.conversation_id)
  );

  conversations = rows
    .filter(row => !hiddenIds.has(row.id))
    .map(conversation => {
      const conversationMembers = (members || []).filter(
        row => row.conversation_id === conversation.id
      );

      const other = conversationMembers.find(
        row => row.user_id !== me.id
      );

      const otherProfile = other
        ? profileMap.get(other.user_id)
        : null;

      const lastMessage = (messages || []).find(
        row => row.conversation_id === conversation.id
      );

      const name =
        conversation.conversation_type === "group"
          ? conversation.title || "グループ"
          : otherProfile?.display_name || "ユーザー";

      return {
        id: conversation.id,
        type: conversation.conversation_type,
        title: conversation.title,
        name,
        peerId: other?.user_id || null,
        avatar_url: otherProfile?.avatar_url || "",
        memberCount: conversationMembers.length,
        last: lastMessage?.deleted_at
          ? "メッセージを削除しました"
          : lastMessage?.content || "",
        time: lastMessage?.created_at || conversation.created_at
      };
    });

  renderCurrentList();
}

function renderCurrentList() {
  if (viewMode === "friends") {
    renderFriends($("searchInput").value);
  } else {
    renderList($("searchInput").value);
  }
}

/* =====================================================
   チャット・友だちの表示
===================================================== */

function renderList(filter = "") {
  const list = $("chatList");
  list.innerHTML = "";

  const rows = conversations
    .filter(row =>
      row.name.toLowerCase().includes(filter.toLowerCase())
    )
    .sort((a, b) => new Date(b.time) - new Date(a.time));

  if (!rows.length) {
    list.innerHTML =
      '<div class="empty">チャットがありません</div>';
    return;
  }

  rows.forEach(conversation => {
    const element = document.createElement("div");
    element.className = "chat-item";

    element.innerHTML = `
      <div class="avatar">
        ${avatar(conversation.name, conversation.avatar_url)}
      </div>
      <div class="chat-info">
        <div class="chat-name">${safe(conversation.name)}</div>
        <div class="chat-preview">
          ${safe(conversation.last || "会話を始めましょう")}
        </div>
      </div>
      <div class="chat-time">
        ${new Date(conversation.time).toLocaleDateString("ja-JP")}
      </div>
    `;

    element.onclick = () => openChat(conversation);

    addLongPress(element, () => {
      conversationMenu(conversation);
    });

    list.appendChild(element);
  });
}

function renderFriends(filter = "") {
  const list = $("chatList");
  list.innerHTML = "";

  const rows = friends.filter(profile =>
    (profile.display_name || "")
      .toLowerCase()
      .includes(filter.toLowerCase())
  );

  if (!rows.length) {
    list.innerHTML = `
      <div class="empty">
        友だちはまだいません<br>
        友だち追加から登録してください
      </div>
    `;
    return;
  }

  rows.forEach(profile => {
    const element = document.createElement("div");
    element.className = "chat-item";

    element.innerHTML = `
      <div class="avatar">
        ${avatar(profile.display_name, profile.avatar_url)}
      </div>
      <div class="chat-info">
        <div class="chat-name">${safe(profile.display_name)}</div>
        <div class="chat-preview">友だち</div>
      </div>
    `;

    element.onclick = () => createChat(profile);

    addLongPress(element, () => {
      friendMenu(profile);
    });

    list.appendChild(element);
  });
}

/* =====================================================
   長押しメニュー
===================================================== */

function addLongPress(element, callback) {
  let timer = null;

  element.addEventListener("touchstart", () => {
    timer = setTimeout(callback, 600);
  }, { passive:true });

  ["touchend", "touchmove", "touchcancel"].forEach(eventName => {
    element.addEventListener(eventName, () => {
      clearTimeout(timer);
    }, { passive:true });
  });

  element.addEventListener("contextmenu", event => {
    event.preventDefault();
    callback();
  });
}

function showContext(items) {
  const box = $("contextMenu");
  box.innerHTML = "";

  items.forEach(item => {
    const button = document.createElement("button");
    button.textContent = item.label;

    button.onclick = () => {
      box.classList.add("hidden");
      item.action();
    };

    box.appendChild(button);
  });

  box.classList.remove("hidden");
  box.style.left = "50%";
  box.style.top = "50%";
  box.style.transform = "translate(-50%,-50%)";
}

document.addEventListener("click", event => {
  if (!event.target.closest("#contextMenu")) {
    $("contextMenu").classList.add("hidden");
  }
});

function conversationMenu(conversation) {

function subscribeList() {
  if (listChannel) {
    db.removeChannel(listChannel);
  }

  listChannel = db
    .channel("gm-list-" + me.id)
    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"gm_messages"
      },
      () => loadConversations()
    )
    .subscribe();
}

/* =====================================================
   友だち管理
===================================================== */

async function hideFriend(profile) {
  if (!confirm(profile.display_name + "を非表示にしますか？")) {
    return;
  }

  const { error } = await db
    .from("gm_friend_hidden")
    .upsert({
      user_id:me.id,
      friend_id:profile.id
    }, {
      onConflict:"user_id,friend_id"
    });

  if (error) {
    notice(error.message);
    return;
  }

  await loadFriends();
  renderFriends();
}

async function removeFriend(profile) {
  if (!confirm(
    profile.display_name + "の友だち登録を削除しますか？"
  )) {
    return;
  }

  const { error } = await db.rpc(
    "gm_remove_friend",
    { p_friend_id:profile.id }
  );

  if (error) {
    notice(error.message);
    return;
  }

  await loadFriends();
  renderFriends();

  notice("友だち登録を削除しました");
}

async function blockFriend(profile) {
  if (!confirm(profile.display_name + "をブロックしますか？")) {
    return;
  }

  const { error } = await db
    .from("gm_blocks")
    .upsert({
      blocker_id:me.id,
      blocked_id:profile.id
    });

  if (error) {
    notice(error.message);
    return;
  }

  blockedUsers.add(profile.id);
  notice("ブロックしました");
}

/* =====================================================
   個別チャット
===================================================== */

async function createChat(profile) {
  if (blockedUsers.has(profile.id)) {
    notice("このユーザーはブロック中です");
    return;
  }

  const { data: blocks } = await db
    .from("gm_blocks")
    .select("blocker_id")
    .eq("blocker_id", profile.id)
    .eq("blocked_id", me.id);

  if (blocks && blocks.length) {
    notice("このユーザーとはチャットできません");
    return;
  }

  const { data, error } = await db.rpc(
    "gm_start_direct_chat",
    { p_other_user_id:profile.id }
  );

  if (error) {
    notice("チャット作成エラー: " + error.message);
    return;
  }

  const conversationId =
    typeof data === "string" ? data : data?.id;

  await loadConversations();

  const conversation =
    conversations.find(row => row.id === conversationId) || {
      id:conversationId,
      name:profile.display_name,
      peerId:profile.id,
      avatar_url:profile.avatar_url,
      type:"direct"
    };

  await openChat(conversation);
}

/* =====================================================
   チャットを開く
===================================================== */

async function openChat(conversation) {
  current = conversation;

  peer = {
    id:conversation.peerId,
    name:conversation.name
  };

  $("app").classList.add("in-chat");

  $("peerName").textContent = conversation.name;
  $("peerAvatar").innerHTML =
    avatar(conversation.name, conversation.avatar_url);

  $("peerStatus").textContent =
    conversation.type === "group"
      ? "グループチャット"
      : "GATE MESSAGE";

  $("messages").innerHTML = "";

  await loadMessages();

  if (messagesChannel) {
    await db.removeChannel(messagesChannel);
  }

  messagesChannel = db
    .channel("gm-room-" + conversation.id)
    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"gm_messages",
        filter:"conversation_id=eq." + conversation.id
      },
      () => loadMessages()
    )
    .subscribe();

  await updatePeerPresence();
}

function backToList() {
  $("app").classList.remove("in-chat");

  if (messagesChannel) {
    db.removeChannel(messagesChannel);
    messagesChannel = null;
  }

  current = null;
  peer = null;
}

/* =====================================================
   メッセージ読み込み
===================================================== */

async function loadMessages() {
  if (!current) return;

  const conversationId = current.id;

  const { data, error } = await db
    .from("gm_messages")
    .select("*")
    .eq("conversation_id", conversationId)
    .order("created_at", { ascending:true });

  if (error) {
    notice("メッセージ取得エラー: " + error.message);
    return;
  }

  if (!current || current.id !== conversationId) return;

  $("messages").innerHTML = "";

  for (const message of data || []) {
    await renderMessage(message);
  }

  $("messages").scrollTop = $("messages").scrollHeight;

  for (const message of (data || []).filter(
    row => row.sender_id !== me.id && !row.deleted_at
  )) {
    await markRead(message);
  }
}

/* =====================================================
   メッセージ表示
===================================================== */

async function renderMessage(message) {
  if (!message || !current) return;

  const mine = message.sender_id === me.id;

  const row = document.createElement("div");
  row.id = "msg-" + message.id;
  row.className = "message-row" + (mine ? " mine" : "");

  let body = "";

  if (message.deleted_at) {
    body = "<i>このメッセージは削除されました</i>";
  } else if (message.message_type === "image") {
    body =
      '<img src="' + safe(message.media_url) +
      '" alt="写真">';
  } else if (message.message_type === "video") {
    body =
      '<video controls playsinline src="' +
      safe(message.media_url) + '"></video>';
  } else if (message.message_type === "sticker") {
    body =
      '<div class="sticker-message">' +
      safe(message.content) +
      '</div>';
  } else {
    body = safe(message.content).replace(/\n/g, "<br>");
  }

  let readText = "";

  if (mine) {
    const { data: reads } = await db
      .from("gm_message_reads")
      .select("user_id")
      .eq("message_id", message.id)
      .neq("user_id", me.id);

    if (reads && reads.length) {
      readText = "既読";
    }
  }

  const { data: reactions } = await db
    .from("gm_message_reactions")
    .select("reaction,user_id")
    .eq("message_id", message.id);

  const reactionText = (reactions || [])
    .map(row => safe(row.reaction))
    .join(" ");

  row.innerHTML = `
    <div class="bubble">${body}</div>
    <div class="message-meta">
      ${new Date(message.created_at).toLocaleTimeString("ja-JP", {
        hour:"2-digit",
        minute:"2-digit"
      })}
      ${message.edited_at ? " 編集" : ""}
      ${readText}
    </div>
    ${reactionText ? "<div>" + reactionText + "</div>" : ""}
    <div class="message-actions">
      ${
        mine && !message.deleted_at
          ? `
            <button onclick="editMessage('${message.id}')">編集</button>
            <button onclick="deleteMessage('${message.id}')">削除</button>
          `
          : ""
      }
      ${
        !message.deleted_at
          ? `
            <button onclick="reactMessage('${message.id}')">❤️</button>
            <button onclick="reportMessage('${message.id}')">通報</button>
          `
          : ""
      }
    </div>
  `;

  $("messages").appendChild(row);
}

/* =====================================================
   写真・動画送信
===================================================== */

async function uploadMedia(input, type) {
  const files = Array.from(input.files || []);

  if (!files.length || !current) return;

  for (const file of files) {
    if (file.size > 50 * 1024 * 1024) {
      notice("50MBを超えています");
      continue;
    }

    const extension =
      (file.name.split(".").pop() || "bin").toLowerCase();

    const path =
      me.id + "/" + Date.now() + "-" +
      crypto.randomUUID() + "." + extension;

    const { error: uploadError } = await db
      .storage
      .from("gm-media")
      .upload(path, file, {
        cacheControl:"3600",
        upsert:false,
        contentType:file.type
      });

    if (uploadError) {
      notice("ファイルアップロードエラー: " + uploadError.message);
      continue;
    }

    const { data } = db
      .storage
      .from("gm-media")
      .getPublicUrl(path);

    const { error } = await db
      .from("gm_messages")
      .insert({
        conversation_id:current.id,
        sender_id:me.id,
        content:type === "image"
          ? "写真を送信しました"
          : "動画を送信しました",
        message_type:type,
        media_url:data.publicUrl,
        media_name:file.name
      });

    if (error) {
      notice("メディア送信エラー: " + error.message);
    }
  }

  input.value = "";
}

  if (!confirm(

  let result;

  if (isBlocked) {
    result = await db
      .from("gm_blocks")
      .delete()
      .eq("blocker_id", me.id)
      .eq("blocked_id", peer.id);

      blockedUsers.delete(peer.id);
    }
  } else {
    result = await db
      .from("gm_blocks")
      .insert({
        blocker_id:me.id,
        blocked_id:peer.id

    if (!result.error) {
      blockedUsers.add(peer.id);

  if (result.error) {
    notice(result.error.message);
    return;
  }

  notice(
    isBlocked
      ? "ブロックを解除しました"
      : "ブロックしました"
  );
}

/* =====================================================
   1対1 音声・ビデオ通話（WebRTC + Supabase Realtime）
   着信通知はログイン中でブラウザ/PWAが起動・接続中の場合に受信します。
===================================================== */

const CALL_ICE_SERVERS = [
  { urls: "stun:stun.l.google.com:19302" },
  { urls: "stun:stun1.l.google.com:19302" }
];

function callOverlayShow() {
  $("callOverlay").classList.remove("hidden");
}

function callOverlayHide() {
  $("callOverlay").classList.add("hidden");
  $("callVideoGrid").classList.add("hidden");
  $("callAvatar").classList.remove("hidden");
  $("incomingCallActions").classList.add("hidden");
  $("activeCallActions").classList.add("hidden");
  $("remoteVideo").srcObject = null;
  $("localVideo").srcObject = null;
}

function callSetStatus(title, subtitle) {
  $("callTitle").textContent = title;
  $("callSubtitle").textContent = subtitle;
}

function callSetVideoMode(enabled) {
  $("callVideoGrid").classList.toggle("hidden", !enabled);
  $("callAvatar").classList.toggle("hidden", enabled);
}

function waitForCallChannel(channel) {
  return new Promise((resolve, reject) => {
    let done = false;
    const timer = setTimeout(() => {
      if (!done) {
        done = true;
        reject(new Error("通話リアルタイム接続がタイムアウトしました"));
      }
    }, 12000);
    channel.subscribe(status => {
      if (status === "SUBSCRIBED" && !done) {
        done = true;
        clearTimeout(timer);
        resolve();
      } else if (["CHANNEL_ERROR", "TIMED_OUT"].includes(status) && !done) {
        done = true;
        clearTimeout(timer);
        reject(new Error("通話リアルタイム接続に失敗しました: " + status));
      }
    });
  });
}

async function subscribeCallChannel(callId) {
  if (activeCallChannel) {
    await db.removeChannel(activeCallChannel);
    activeCallChannel = null;
  }
  const channel = db.channel("gm-call-" + callId).on(
    "postgres_changes",
    { event: "INSERT", schema: "public", table: "gm_call_signals", filter: "call_id=eq." + callId },
    payload => { handleCallSignal(payload.new); }
  );
  activeCallChannel = channel;
  await waitForCallChannel(channel);
}

async function sendCallSignal(kind, payload = {}) {
  if (!activeCall || !me) throw new Error("通話情報がありません");
  const { error } = await db.from("gm_call_signals").insert({
    call_id: activeCall.id,
    conversation_id: activeCall.conversationId,
    from_user: me.id,
    to_user: activeCall.peerId,
    kind,
    payload
  });
  if (error) throw error;
}

async function createCallPeerConnection() {
  const pc = new RTCPeerConnection({ iceServers: CALL_ICE_SERVERS });
  activeCall.pc = pc;
  pc.onicecandidate = event => {
    if (event.candidate && activeCall && activeCall.pc === pc) {
      sendCallSignal("ice", event.candidate.toJSON()).catch(error => {
        console.error("ICE送信エラー", error);
      });
    }
  };
  pc.ontrack = event => {
    const stream = event.streams && event.streams[0];
    if (stream) {
      $("remoteVideo").srcObject = stream;
      $("remoteVideo").play().catch(() => {});
    }
  };
  pc.onconnectionstatechange = () => {
    if (!activeCall || activeCall.pc !== pc) return;
    if (pc.connectionState === "connected") {
      callSetStatus(activeCall.peerName, "通話中");
    } else if (pc.connectionState === "failed") {
      notice("通話接続に失敗しました。ネットワーク環境を確認してください。");
      endCall(false);
    } else if (pc.connectionState === "disconnected") {
      callSetStatus(activeCall.peerName, "接続が不安定です...");
    }
  };
  return pc;
}

async function getCallMedia(type) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error("通話にはHTTPS接続とマイク/カメラ対応ブラウザが必要です");
  }
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true },
    video: type === "video" ? { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } } : false
  });
  activeCall.localStream = stream;
  callMicEnabled = true;
  callCameraEnabled = type === "video";
  if (type === "video") {
    $("localVideo").srcObject = stream;
    $("localVideo").play().catch(() => {});
  }
  return stream;
}

async function startCall(type) {
  if (!me || !current || !peer || !peer.id) {
    notice("個別チャットを開いてから通話してください");
    return;
  }
  if (current.type !== "direct") {
    notice("通話は1対1の個別チャットで利用できます");
    return;
  }
  if (activeCall || incomingCall) {
    notice("すでに通話中、または着信があります");
    return;
  }
  if (!window.isSecureContext) {
    notice("通話にはHTTPS接続が必要です。GitHub Pagesのhttps://で開いてください。");
    return;
  }

  activeCall = {
    id: crypto.randomUUID(), conversationId: current.id,
    peerId: peer.id, peerName: peer.name || current.name || "相手",
    type, role: "caller", pc: null, localStream: null
  };
  callRemoteDescriptionSet = false;
  callPendingCandidates = [];
  callOverlayShow();
  $("incomingCallActions").classList.add("hidden");
  $("activeCallActions").classList.remove("hidden");
  $("callAvatar").textContent = type === "video" ? "▣" : "☎";
  callSetVideoMode(type === "video");
  callSetStatus(activeCall.peerName, "発信しています...");

  try {
    const stream = await getCallMedia(type);
    const pc = await createCallPeerConnection();
    stream.getTracks().forEach(track => pc.addTrack(track, stream));
    // 相手の応答を取りこぼさないよう、offer送信前に購読する
    await subscribeCallChannel(activeCall.id);
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await sendCallSignal("offer", {
      type: pc.localDescription.type,
      sdp: pc.localDescription.sdp,
      media_type: type
    });
    callSetStatus(activeCall.peerName, "呼び出し中...");
    $("muteButton").textContent = "マイクOFF";
    $("cameraButton").classList.toggle("hidden", type !== "video");
  } catch (error) {
    console.error(error);
    notice("通話を開始できません: " + error.message);
    await endCall(false);
  }
}

async function subscribeIncomingCalls() {
  if (!me) return;
  if (incomingCallChannel) await db.removeChannel(incomingCallChannel);
  incomingCallChannel = db.channel("gm-incoming-calls-" + me.id).on(
    "postgres_changes",
    { event: "INSERT", schema: "public", table: "gm_call_signals", filter: "to_user=eq." + me.id },
    async payload => {
      const signal = payload.new;
      if (!signal || signal.kind !== "offer") return;
      if (activeCall || incomingCall) {
        try {
          await db.from("gm_call_signals").insert({
            call_id: signal.call_id, conversation_id: signal.conversation_id,
            from_user: me.id, to_user: signal.from_user, kind: "busy", payload: {}
          });
        } catch (error) { console.warn(error); }
        return;
      }
      const { data: profile } = await db.from("profiles")
        .select("display_name").eq("id", signal.from_user).maybeSingle();
      incomingCall = {
        id: signal.call_id, conversationId: signal.conversation_id,
        peerId: signal.from_user, peerName: profile?.display_name || "相手",
        type: signal.payload?.media_type === "video" ? "video" : "audio",
        offer: signal.payload
      };
      callOverlayShow();
      callSetVideoMode(false);
      $("callAvatar").textContent = incomingCall.type === "video" ? "▣" : "☎";
      callSetStatus(incomingCall.peerName,
        incomingCall.type === "video" ? "ビデオ通話の着信" : "音声通話の着信");
      $("incomingCallActions").classList.remove("hidden");
      $("activeCallActions").classList.add("hidden");
    }
  ).subscribe(status => {
    if (status === "CHANNEL_ERROR") console.warn("着信チャンネル接続エラー");
  });
}

async function acceptCall() {
  if (!incomingCall || activeCall) return;
  const offered = incomingCall;
  incomingCall = null;
  activeCall = {
    id: offered.id, conversationId: offered.conversationId,
    peerId: offered.peerId, peerName: offered.peerName,
    type: offered.type, role: "callee", pc: null, localStream: null
  };
  callRemoteDescriptionSet = false;
  callPendingCandidates = [];
  try {
    $("incomingCallActions").classList.add("hidden");
    $("activeCallActions").classList.remove("hidden");
    callSetStatus(activeCall.peerName, "接続しています...");
    callSetVideoMode(activeCall.type === "video");
    const stream = await getCallMedia(activeCall.type);
    const pc = await createCallPeerConnection();
    stream.getTracks().forEach(track => pc.addTrack(track, stream));
    await subscribeCallChannel(activeCall.id);
    await pc.setRemoteDescription(new RTCSessionDescription({
      type: offered.offer.type, sdp: offered.offer.sdp
    }));
    callRemoteDescriptionSet = true;
    await flushCallCandidates();
    // 購読開始前に届いたICE候補もDBから回収
    const { data: oldSignals, error: oldError } = await db.from("gm_call_signals")
      .select("payload,from_user").eq("call_id", activeCall.id)
      .eq("kind", "ice").neq("from_user", me.id);
    if (oldError) throw oldError;
    for (const row of oldSignals || []) {
      try { await pc.addIceCandidate(new RTCIceCandidate(row.payload)); }
      catch (error) { console.warn("既存ICE候補", error); }
    }
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await sendCallSignal("answer", {
      type: pc.localDescription.type, sdp: pc.localDescription.sdp
    });
    callSetStatus(activeCall.peerName, "応答しました。接続中...");
    $("muteButton").textContent = "マイクOFF";
    $("cameraButton").classList.toggle("hidden", activeCall.type !== "video");
  } catch (error) {
    console.error(error);
    notice("通話に応答できません: " + error.message);
    await endCall(true);
  }
}

async function rejectCall() {
  if (!incomingCall || !me) return;
  const call = incomingCall;
  incomingCall = null;
  try {
    await db.from("gm_call_signals").insert({
      call_id: call.id, conversation_id: call.conversationId,
      from_user: me.id, to_user: call.peerId, kind: "reject", payload: {}
    });
  } catch (error) { console.warn("拒否通知エラー", error); }
  callOverlayHide();
}

async function flushCallCandidates() {
  if (!activeCall?.pc || !callRemoteDescriptionSet) return;
  const queued = callPendingCandidates.splice(0);
  for (const candidate of queued) {
    try { await activeCall.pc.addIceCandidate(new RTCIceCandidate(candidate)); }
    catch (error) { console.warn("ICE候補エラー", error); }
  }
}

async function handleCallSignal(signal) {
  if (!activeCall || !signal || signal.call_id !== activeCall.id || signal.from_user === me.id) return;
  try {
    if (signal.kind === "answer" && activeCall.role === "caller") {
      await activeCall.pc.setRemoteDescription(new RTCSessionDescription({
        type: signal.payload.type, sdp: signal.payload.sdp
      }));
      callRemoteDescriptionSet = true;
      await flushCallCandidates();
      callSetStatus(activeCall.peerName, "接続しています...");
    } else if (signal.kind === "ice") {
      if (!callRemoteDescriptionSet) callPendingCandidates.push(signal.payload);
      else await activeCall.pc.addIceCandidate(new RTCIceCandidate(signal.payload));
    } else if (signal.kind === "reject") {
      notice("相手が通話を拒否しました");
      await endCall(false);
    } else if (signal.kind === "busy") {
      notice("相手は別の通話中です");
      await endCall(false);
    } else if (signal.kind === "hangup") {
      notice("通話が終了しました");
      await endCall(false);
    }
  } catch (error) {
    console.error("通話信号処理エラー", error);
    notice("通話処理に失敗しました: " + error.message);
    await endCall(false);
  }
}

function toggleCallMute() {
  if (!activeCall?.localStream) return;
  callMicEnabled = !callMicEnabled;
  activeCall.localStream.getAudioTracks().forEach(track => { track.enabled = callMicEnabled; });
  $("muteButton").textContent = callMicEnabled ? "マイクOFF" : "マイクON";
}

function toggleCallCamera() {
  if (!activeCall?.localStream || activeCall.type !== "video") return;
  callCameraEnabled = !callCameraEnabled;
  activeCall.localStream.getVideoTracks().forEach(track => { track.enabled = callCameraEnabled; });
  $("cameraButton").textContent = callCameraEnabled ? "カメラOFF" : "カメラON";
}

async function endCall(sendSignal = true) {
  const call = activeCall;
  activeCall = null;
  incomingCall = null;
  callRemoteDescriptionSet = false;
  callPendingCandidates = [];
  if (call && sendSignal && me) {
    try {
      await db.from("gm_call_signals").insert({
        call_id: call.id, conversation_id: call.conversationId,
        from_user: me.id, to_user: call.peerId, kind: "hangup", payload: {}
      });
    } catch (error) { console.warn("通話終了通知エラー", error); }
  }
  if (call?.pc) {
    call.pc.ontrack = null;
    call.pc.onicecandidate = null;
    call.pc.close();
  }
  if (call?.localStream) call.localStream.getTracks().forEach(track => track.stop());
  if (activeCallChannel) {
    await db.removeChannel(activeCallChannel);
    activeCallChannel = null;
  }
  callOverlayHide();
}

/* =====================================================
   PWA インストール
===================================================== */

window.addEventListener("beforeinstallprompt", event => {
  event.preventDefault();
  deferredInstallPrompt = event;
  const button = $("installAppButton");
  if (button) button.classList.remove("hidden");
});

window.addEventListener("appinstalled", () => {
  deferredInstallPrompt = null;
  notice("GATE MESSAGEをアプリとしてインストールしました");
});

async function installApp() {
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    return;
  }
  notice("インストールできない場合は、ブラウザのメニューから「アプリをインストール」または「ホーム画面に追加」を選んでください");
}

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(error => {
      console.warn("Service Worker登録エラー", error);
    });
  });
}

/* =====================================================
   ログアウト
===================================================== */

async function logout() {
  if (activeCall) await endCall(false);
  incomingCall = null;
  if (incomingCallChannel) {
    await db.removeChannel(incomingCallChannel);
    incomingCallChannel = null;
  }
  if (presenceTimer) {
    clearInterval(presenceTimer);
  }

  if (messagesChannel) {
    await db.removeChannel(messagesChannel);
  }

  if (listChannel) {
    await db.removeChannel(listChannel);
  }

  if (me) {
    await db
      .from("gm_user_presence")
      .upsert({
        user_id:me.id,
        is_online:false,
        last_seen_at:new Date().toISOString()
      }, {
        onConflict:"user_id"
      });
  }

  await db.auth.signOut();

  me = null;
  location.reload();
}

/* =====================================================
   イベント設定
===================================================== */

$("searchInput").addEventListener("input", event => {
  if (viewMode === "friends") {
    renderFriends(event.target.value);
  } else {
    renderList(event.target.value);
  }
});

$("messageInput").addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

$("photoFile").addEventListener("change", event => {
  uploadMedia(event.target, "image");
});

$("videoFile").addEventListener("change", event => {
  uploadMedia(event.target, "video");
});

/* =====================================================
   初期化
===================================================== */

buildStickers();

db.auth.getSession().then(({ data, error }) => {
  if (error) {
    notice(error.message);
    return;
  }

  if (data.session) {
    startApp(data.session.user);
  }
});

db.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_OUT") {
    me = null;

    $("app").classList.add("hidden");
    $("loginScreen").classList.remove("hidden");
  }
});
