<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GATE MESSAGE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#3478f6;--bg:#f4f6fa;--text:#172033;--muted:#8792a5;--line:#e8ecf2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(140deg,#10213e,#3478f6)}
.login-card{width:100%;max-width:390px;background:white;padding:32px;border-radius:24px;box-shadow:0 20px 70px #001b4530}
.logo{font-size:25px;font-weight:900;letter-spacing:1px}
.logo span{color:var(--blue)}
.sub{color:var(--muted);font-size:13px;margin:8px 0 25px}
.field{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;margin:7px 0;outline:none}
.field:focus{border-color:var(--blue)}
.primary{background:var(--blue);color:white;border:0;padding:13px;border-radius:12px;font-weight:bold;width:100%;margin-top:10px}
.secondary{background:#edf2ff;color:var(--blue);border:0;padding:10px;border-radius:10px}
.danger{background:#fff0f0;color:#d33}
#app{max-width:1400px;margin:auto;height:100dvh;display:flex;background:white;overflow:hidden}
.sidebar{width:350px;min-width:290px;border-right:1px solid var(--line);display:flex;flex-direction:column}
.top{padding:18px;border-bottom:1px solid var(--line)}
.topline{display:flex;justify-content:space-between;align-items:center}
.search{width:100%;padding:12px 14px;border:0;background:var(--bg);border-radius:12px;margin-top:16px;outline:none}
.tabs{display:flex;gap:16px;margin-top:15px;font-size:13px;color:var(--muted)}
.tabs span{cursor:pointer}
#chatList{overflow:auto;flex:1}
.chat-item{display:flex;align-items:center;gap:11px;padding:13px 15px;cursor:pointer;border-bottom:1px solid #f1f2f5}
.chat-item:hover{background:#f7f9fc}
.avatar{width:46px;height:46px;flex-shrink:0;border-radius:50%;background:#e3edff;display:flex;align-items:center;justify-content:center;color:var(--blue);font-weight:bold;font-size:18px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.chat-info{flex:1;min-width:0}
.chat-name{font-weight:700;font-size:14px}
.chat-preview{color:var(--muted);font-size:12px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:10px;color:var(--muted)}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:white}
.chat-header{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 17px;gap:11px}
.chat-header-info{flex:1;min-width:0}
.chat-header-name{font-weight:bold}
.chat-status{font-size:11px;color:var(--muted);margin-top:4px}
.icon-btn{border:0;background:transparent;font-size:20px;padding:8px;color:#64748b;border-radius:10px}
.icon-btn:hover{background:var(--bg)}
#messages{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:12px;background:#fafbfe}
.msg-row{display:flex;flex-direction:column;max-width:78%;align-items:flex-start}
.msg-row.mine{align-self:flex-end;align-items:flex-end}
.bubble{background:white;padding:11px 14px;border-radius:17px;box-shadow:0 1px 4px #0000000a;font-size:14px;line-height:1.6;overflow-wrap:anywhere}
.mine .bubble{background:var(--blue);color:white;border-bottom-right-radius:5px}
.msg-row:not(.mine) .bubble{border-bottom-left-radius:5px}
.msg-meta{font-size:10px;color:#9aa3b2;margin-top:4px}
.mine .msg-meta{text-align:right}
.bubble img,.bubble video{display:block;max-width:100%;max-height:320px;border-radius:12px}
.sticker{font-size:60px;padding:7px}
.msg-actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.msg-actions button{border:0;background:#edf1f7;border-radius:9px;padding:5px 8px;font-size:12px;color:#52617a}
.reaction-list{font-size:12px;margin-top:5px}
.composer{border-top:1px solid var(--line);padding:11px 16px 16px;background:white}
.tools{display:flex;gap:7px;margin-bottom:9px;flex-wrap:wrap}
.tool{border:0;background:#f1f4f9;color:#52617a;border-radius:10px;padding:8px 11px;font-size:15px}
.sendline{display:flex;align-items:center;gap:9px}
#messageInput{flex:1;border:0;background:#f2f4f8;border-radius:22px;padding:13px 16px;outline:none;min-width:0}
.send{background:var(--blue);color:white;border:0;border-radius:50%;width:44px;height:44px;font-size:18px}
.empty{margin:auto;text-align:center;color:var(--muted);padding:25px}
.empty strong{display:block;color:#344158;font-size:20px;margin:10px}
#mobileBack{display:none}
#userPanel{position:fixed;right:18px;top:70px;background:white;padding:12px;border:1px solid var(--line);border-radius:15px;box-shadow:0 10px 30px #0002;z-index:20;min-width:220px;max-height:80vh;overflow:auto}
.menu-btn{display:block;width:100%;padding:11px;text-align:left;border:0;background:white;border-radius:8px;font-size:13px}
.menu-btn:hover{background:var(--bg)}
#notice{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#172033;color:white;padding:12px 18px;border-radius:12px;z-index:40;font-size:13px;max-width:90%;display:none}
#stickerPanel{display:none;position:absolute;bottom:105px;background:white;border:1px solid var(--line);box-shadow:0 5px 25px #0002;border-radius:15px;padding:13px;max-width:290px;z-index:10}
.sticker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sticker-grid button{font-size:29px;border:0;background:#f5f7fa;border-radius:10px;padding:7px}
.modal{position:fixed;inset:0;background:#0007;z-index:30;display:flex;align-items:center;justify-content:center;padding:15px}
.modal-card{background:white;border-radius:18px;padding:22px;width:100%;max-width:430px;max-height:85vh;overflow:auto}
.modal-card h3{margin-top:0}
.modal-card textarea{width:100%;min-height:85px;padding:12px;border:1px solid var(--line);border-radius:10px}
.modal-actions{display:flex;gap:8px;margin-top:12px}
.modal-actions button{flex:1}
.online-dot{display:inline-block;width:8px;height:8px;background:#25bd70;border-radius:50%;margin-right:5px}
.offline-dot{display:inline-block;width:8px;height:8px;background:#aab2bf;border-radius:50%;margin-right:5px}
@media(max-width:700px){
 #app{height:100dvh}
 .sidebar{width:100%;min-width:0;border:0}
 .main{display:none;width:100%}
 #app.in-chat .sidebar{display:none}
 #app.in-chat .main{display:flex}
 #mobileBack{display:block}
 .chat-header{height:64px;padding:0 8px}
 #messages{padding:13px}
 .msg-row{max-width:88%}
 .composer{padding:9px}
 .top{padding:14px}
}
</style>
</head>
<body>

<section id="login">
 <div class="login-card">
  <div class="logo">GATE <span>MESSAGE</span></div>
  <div class="sub">Connect with everyone.</div>
  <input id="email" class="field" type="email" placeholder="メールアドレス">
  <input id="password" class="field" type="password" placeholder="パスワード">
  <button class="primary" onclick="login()">ログイン</button>
  <p id="loginError" style="color:#e44;font-size:12px"></p>
 </div>
</section>

<div id="app" class="hidden">
 <aside class="sidebar">
  <div class="top">
   <div class="topline">
    <div class="logo">GATE <span>MESSAGE</span></div>
    <button class="icon-btn" onclick="newChat()">＋</button>
   </div>
   <input class="search" id="search" placeholder="ユーザー・チャットを検索" oninput="searchAll()">
   <div class="tabs">
    <span onclick="renderList()">すべて</span>
    <span onclick="newChat()">友だちを探す ＋</span>
    <span onclick="showHiddenChats()">非表示一覧</span>
   </div>
  </div>
  <div id="chatList"></div>
  <div style="padding:13px;border-top:1px solid var(--line);display:flex;align-items:center;gap:9px">
   <div class="avatar" id="myAvatar">G</div>
   <div style="flex:1;min-width:0">
    <b id="myName">ユーザー</b>
    <div style="font-size:11px;color:var(--muted)">GATE MESSAGE</div>
   </div>
   <button class="icon-btn" onclick="toggleMenu()">⚙</button>
  </div>
 </aside>

 <main class="main">
  <header class="chat-header">
   <button class="icon-btn" id="mobileBack" onclick="backToList()">‹</button>
   <div class="avatar" id="peerAvatar">G</div>
   <div class="chat-header-info">
    <div class="chat-header-name" id="peerName">チャット</div>
    <div class="chat-status" id="peerStatus">GATE MESSAGE</div>
   </div>
   <button class="icon-btn" onclick="callNotice('音声通話機能は準備中です')">☎</button>
   <button class="icon-btn" onclick="callNotice('ビデオ通話機能は準備中です')">▣</button>
   <button class="icon-btn" onclick="toggleMenu()">⋯</button>
  </header>

  <div id="messages">
   <div class="empty"><strong>GATE MESSAGE</strong>会話を選択してください</div>
  </div>

  <div class="composer">
   <div class="tools">
    <button class="tool" onclick="$('photoFile').click()">📷 写真</button>
    <button class="tool" onclick="$('videoFile').click()">🎥 動画</button>
    <button class="tool" onclick="toggleStickers()">😊 スタンプ</button>
    <button class="tool" onclick="callNotice('メッセージの下にあるボタンからリアクションできます')">❤️ リアクション</button>
   </div>
   <div id="stickerPanel">
    <div class="sticker-grid" id="stickerGrid"></div>
   </div>
   <div class="sendline">
    <input id="messageInput" placeholder="メッセージを入力..."
     onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}">
    <button class="send" onclick="sendMessage()">➤</button>
   </div>
   <input id="photoFile" type="file" accept="image/*" multiple hidden onchange="uploadMedia(this,'image')">
   <input id="videoFile" type="file" accept="video/mp4,video/webm" multiple hidden onchange="uploadMedia(this,'video')">
  </div>
 </main>
</div>

<div id="userPanel" class="hidden">
 <button class="menu-btn" onclick="editProfile()">プロフィール編集</button>
 <button class="menu-btn" onclick="uploadAvatar()">プロフィール画像変更</button>
 <button class="menu-btn" onclick="createGroup()">グループチャット作成</button>
 <button class="menu-btn" onclick="showGroupMembers()">グループメンバー表示</button>
 <button class="menu-btn" onclick="leaveGroup()">グループから退出</button>
 <button class="menu-btn" onclick="hideConversation()">チャットを非表示</button>
 <button class="menu-btn" onclick="toggleBlock()">ブロック・解除</button>
 <button class="menu-btn" onclick="reportUser()">ユーザーを通報</button>
 <button class="menu-btn" onclick="logout()">ログアウト</button>
 <button class="menu-btn" onclick="toggleMenu()">閉じる</button>
</div>

<div id="modal" class="modal hidden">
 <div class="modal-card">
  <h3 id="modalTitle">確認</h3>
  <div id="modalBody"></div>
  <div class="modal-actions">
   <button class="secondary" onclick="closeModal()">閉じる</button>
  </div>
 </div>
</div>
<div id="notice"></div>

<script>
const SUPABASE_URL='https://hxrtpftlklgwesvanlpk.supabase.co';
const SUPABASE_KEY='sb_publishable_b1tG9o1bXMzZBXGHBJZhZA_Ak-KYmnZ';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let me=null,current=null,peer=null;
let messagesChannel=null,listChannel=null;
let conversations=[],blockedUsers=new Set(),searchTimer=null;
let presenceTimer=null;

const $=id=>document.getElementById(id);

function notice(text){
 $('notice').textContent=text;
 $('notice').style.display='block';
 clearTimeout(notice.timer);
 notice.timer=setTimeout(()=>$('notice').style.display='none',3000);
}
function callNotice(text){notice(text)}
function safe(s){
 return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function avatar(name,url){
 if(url)return '<img src="'+safe(url)+'" alt="">';
 return safe((name||'G').trim().charAt(0).toUpperCase());
}
function closeModal(){$('modal').classList.add('hidden')}
function showModal(title,html){
 $('modalTitle').textContent=title;
 $('modalBody').innerHTML=html;
 $('modal').classList.remove('hidden');
}
function toggleMenu(){$('userPanel').classList.toggle('hidden')}

async function login(){
 const email=$('email').value.trim(),password=$('password').value;
 $('loginError').textContent='';
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error){$('loginError').textContent=error.message;return}
 await startApp(data.user);
}

async function startApp(user){
 me=user;
 const {data:profile,error}=await db.from('profiles')
  .select('id,display_name,avatar_url,bio').eq('id',me.id).maybeSingle();
 if(error){notice('プロフィール取得エラー: '+error.message);return}
 if(!profile){notice('プロフィールが登録されていません');return}
 me.name=profile.display_name||'ユーザー';
 me.avatar_url=profile.avatar_url||'';
 me.bio=profile.bio||'';
 $('myName').textContent=me.name;
 $('myAvatar').innerHTML=avatar(me.name,me.avatar_url);
 $('login').classList.add('hidden');
 $('app').classList.remove('hidden');
 await loadBlocks();
 await loadConversations();
 await updatePresence();
 startPresence();
 subscribeList();
}

async function loadBlocks(){
 const {data,error}=await db.from('gm_blocks').select('blocked_id').eq('blocker_id',me.id);
 if(error){notice('ブロック一覧取得エラー: '+error.message);return}
 blockedUsers=new Set((data||[]).map(x=>x.blocked_id));
}

async function loadConversations(){
 const {data,error}=await db.from('gm_conversation_members')
  .select('conversation_id,gm_conversations(id,conversation_type,title,created_at,gm_conversation_members(user_id,profiles(id,display_name,avatar_url)),gm_messages(id,content,message_type,created_at,sender_id,deleted_at))')
  .eq('user_id',me.id);
 if(error){notice('チャット一覧エラー: '+error.message);return}

 conversations=(data||[]).map(row=>{
  const c=row.gm_conversations;
  if(!c)return null;
  const members=c.gm_conversation_members||[];
  const other=members.find(m=>m.user_id!==me.id);
  const p=other?.profiles;
  const last=(c.gm_messages||[]).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];
  return {
   id:c.id,type:c.conversation_type,title:c.title,
   name:c.conversation_type==='group'?(c.title||'グループ'):(p?.display_name||'ユーザー'),
   peerId:other?.user_id,avatar_url:p?.avatar_url||'',
   memberCount:members.length,
   last:last?.deleted_at?'メッセージを削除しました':last?.content||'',
   time:last?.created_at||c.created_at
  };
 }).filter(Boolean);

 const {data:hidden,error:hiddenError}=await db.from('gm_conversation_hidden')
  .select('conversation_id').eq('user_id',me.id);
 if(hiddenError){notice('非表示情報取得エラー: '+hiddenError.message);return}
 const hiddenIds=new Set((hidden||[]).map(x=>x.conversation_id));
 conversations=conversations.filter(c=>!hiddenIds.has(c.id));
 renderList();
}

function renderList(filter=''){
 const list=$('chatList');
 const filtered=conversations.filter(c=>c.name.toLowerCase().includes(filter.toLowerCase()));
 list.innerHTML='';
 if(!filtered.length){
  list.innerHTML='<div class="empty">チャットがありません<br>＋からユーザーを探しましょう</div>';
  return;
 }
 filtered.sort((a,b)=>new Date(b.time)-new Date(a.time));
 filtered.forEach(c=>{
  const el=document.createElement('div');
  el.className='chat-item';
  el.innerHTML=`
   <div class="avatar">${avatar(c.name,c.avatar_url)}</div>
   <div class="chat-info">
    <div class="chat-name">${safe(c.name)}</div>
    <div class="chat-preview">${safe(c.last||'メッセージを始めましょう')}</div>
   </div>
   <div class="time">${new Date(c.time).toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'})}</div>`;
  el.onclick=()=>openChat(c);
  list.appendChild(el);
 });
}

function subscribeList(){
 if(listChannel)db.removeChannel(listChannel);
 listChannel=db.channel('gm-list-'+me.id)
 .on('postgres_changes',{event:'*',schema:'public',table:'gm_messages'},()=>loadConversations())
 .subscribe();
}

async function newChat(){
 const name=prompt('相手の表示名を入力してください');
 if(!name?.trim())return;
 const {data,error}=await db.from('profiles').select('id,display_name,avatar_url')
  .ilike('display_name','%'+name.trim()+'%').neq('id',me.id).limit(20);
 if(error){notice(error.message);return}
 if(!data?.length){notice('ユーザーが見つかりません');return}
 if(data.length===1){await createChat(data[0]);return}
 const choice=prompt(data.map((p,i)=>(i+1)+'. '+p.display_name).join('\n')+'\n番号を入力');
 const p=data[Number(choice)-1];
 if(p)await createChat(p);
}

async function searchAll(){
 clearTimeout(searchTimer);
 const q=$('search').value.trim();
 renderList(q);
 if(q.length<2)return;
 searchTimer=setTimeout(async()=>{
  const {data,error}=await db.from('profiles').select('id,display_name,avatar_url')
   .ilike('display_name','%'+q+'%').neq('id',me.id).limit(15);
  if(error)return;
  (data||[]).forEach(p=>{
   if(conversations.some(c=>c.peerId===p.id))return;
   const el=document.createElement('div');
   el.className='chat-item';
   el.innerHTML='<div class="avatar">'+avatar(p.display_name,p.avatar_url)+'</div><div class="chat-info"><div class="chat-name">'+safe(p.display_name)+'</div><div class="chat-preview">ユーザー・新しいチャット</div></div>';
   el.onclick=()=>createChat(p);
   $('chatList').prepend(el);
  });
 },300);
}

async function createChat(p){
 if(blockedUsers.has(p.id)){notice('このユーザーはブロック中です');return}
 const {data:blocks}=await db.from('gm_blocks').select('blocker_id')
  .eq('blocker_id',p.id).eq('blocked_id',me.id);
 if(blocks?.length){notice('このユーザーとはチャットできません');return}
 const {data,error}=await db.rpc('gm_start_direct_chat',{p_other_user_id:p.id});
 if(error){notice('チャット作成エラー: '+error.message);return}
 const id=typeof data==='string'?data:data?.id;
 if(!id){notice('チャットIDを取得できません');return}
 await loadConversations();
 const c=conversations.find(x=>x.id===id)||{id,name:p.display_name,peerId:p.id,avatar_url:p.avatar_url};
 await openChat(c);
}

async function openChat(c){
 current=c;
 peer={id:c.peerId,name:c.name};
 $('app').classList.add('in-chat');
 $('peerName').textContent=c.name;
 $('peerAvatar').innerHTML=avatar(c.name,c.avatar_url);
 $('peerStatus').textContent=c.type==='group'?'グループチャット':'GATE MESSAGE';
 $('messages').innerHTML='';
 await loadMessages();
 if(messagesChannel)await db.removeChannel(messagesChannel);
 messagesChannel=db.channel('gm-room-'+c.id)
 .on('postgres_changes',{event:'INSERT',schema:'public',table:'gm_messages',filter:'conversation_id=eq.'+c.id},async payload=>{
  await renderMessage(payload.new);
  await markRead(payload.new);
 })
 .on('postgres_changes',{event:'UPDATE',schema:'public',table:'gm_messages',filter:'conversation_id=eq.'+c.id},()=>loadMessages())
 .subscribe();
 await updatePeerPresence();
}

function backToList(){
 $('app').classList.remove('in-chat');
 if(messagesChannel){db.removeChannel(messagesChannel);messagesChannel=null}
 current=null;peer=null;
}

async function loadMessages(){
 if(!current)return;
 const {data,error}=await db.from('gm_messages').select('*')
  .eq('conversation_id',current.id).order('created_at',{ascending:true});
 if(error){notice(error.message);return}
 $('messages').innerHTML='';
 for(const m of data||[])await renderMessage(m);
 $('messages').scrollTop=$('messages').scrollHeight;
 for(const m of (data||[]).filter(m=>m.sender_id!==me.id&&!m.deleted_at))await markRead(m);
}

async function renderMessage(m){
 if(!m||!current||m.conversation_id!==current.id)return;
 const old=$('msg-'+m.id);
 if(old)old.remove();
 const mine=m.sender_id===me.id;
 const row=document.createElement('div');
 row.id='msg-'+m.id;
 row.className='msg-row'+(mine?' mine':'');
 let body='';
 if(m.deleted_at)body='<i>このメッセージは削除されました</i>';
 else if(m.message_type==='image')body='<img src="'+safe(m.media_url)+'" alt="写真">';
 else if(m.message_type==='video')body='<video controls playsinline src="'+safe(m.media_url)+'"></video>';
 else if(m.message_type==='sticker')body='<div class="sticker">'+safe(m.content)+'</div>';
 else body=safe(m.content).replace(/\n/g,'<br>');

 let readText='';
 if(mine){
  const {data:reads}=await db.from('gm_message_reads').select('user_id')
   .eq('message_id',m.id).neq('user_id',me.id);
  if(reads?.length)readText='既読';
 }
 const {data:reactions}=await db.from('gm_message_reactions')
  .select('reaction,user_id').eq('message_id',m.id);
 const reactionText=(reactions||[]).map(r=>safe(r.reaction)).join(' ');

 row.innerHTML='<div class="bubble">'+body+'</div>'+
  '<div class="msg-meta">'+new Date(m.created_at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+
  (m.edited_at?' 編集':'')+' '+readText+'</div>'+
  (reactionText?'<div class="reaction-list">'+reactionText+'</div>':'')+
  '<div class="msg-actions">'+
  (mine&&!m.deleted_at?'<button onclick="editMessage(\''+m.id+'\')">編集</button><button onclick="deleteMessage(\''+m.id+'\')">削除</button>':'')+
  (!m.deleted_at?'<button onclick="reactMessage(\''+m.id+'\')">❤️</button><button onclick="reportMessage(\''+m.id+'\')">通報</button>':'')+
  '</div>';
 $('messages').appendChild(row);
 $('messages').scrollTop=$('messages').scrollHeight;
}

async function markRead(m){
 if(!m||m.sender_id===me.id)return;
 const {error}=await db.from('gm_message_reads').upsert({
  message_id:m.id,user_id:me.id
 },{onConflict:'message_id,user_id',ignoreDuplicates:true});
 if(error)console.error(error);
}

async function sendMessage(){
 if(!current)return;
 const text=$('messageInput').value.trim();
 if(!text)return;
 if(peer?.id&&blockedUsers.has(peer.id)){notice('ブロック中のため送信できません');return}
 if(peer?.id){
  const {data:blocks}=await db.from('gm_blocks').select('blocker_id')
   .eq('blocker_id',peer.id).eq('blocked_id',me.id);
  if(blocks?.length){notice('相手からブロックされています');return}
 }
 const {error}=await db.from('gm_messages').insert({
  conversation_id:current.id,sender_id:me.id,content:text,message_type:'text'
 });
 if(error){notice('送信できません: '+error.message);return}
 $('messageInput').value='';
}

async function uploadMedia(input,type){
 const files=Array.from(input.files||[]);
 if(!files.length||!current)return;
 for(const file of files){
  if(file.size>50*1024*1024){notice(file.name+' は50MBを超えています');continue}
  const ext=(file.name.split('.').pop()||'bin').toLowerCase();
  const path=me.id+'/'+Date.now()+'-'+crypto.randomUUID()+'.'+ext;
  notice(file.name+' をアップロード中...');
  const {error:uploadError}=await db.storage.from('gm-media').upload(path,file,{
   cacheControl:'3600',upsert:false,contentType:file.type
  });
  if(uploadError){notice('アップロード失敗: '+uploadError.message);continue}
  const {data}=db.storage.from('gm-media').getPublicUrl(path);
  const {error}=await db.from('gm_messages').insert({
   conversation_id:current.id,sender_id:me.id,
   content:type==='image'?'写真を送信しました':'動画を送信しました',
   message_type:type,media_url:data.publicUrl,media_name:file.name
  });
  if(error)notice('送信失敗: '+error.message);
 }
 input.value='';
 notice('メディアの送信処理が完了しました');
}

const stickers=['😀','😂','🥰','😍','😭','😎','👍','❤️','🎉','🙏','🐱','🐶','🌸','🔥','✨','💯'];
function buildStickers(){
 $('stickerGrid').innerHTML='';
 stickers.forEach(s=>{
  const b=document.createElement('button');
  b.textContent=s;b.onclick=()=>sendSticker(s);
  $('stickerGrid').appendChild(b);
 });
}
function toggleStickers(){
 const p=$('stickerPanel');
 p.style.display=p.style.display==='block'?'none':'block';
}
async function sendSticker(s){
 if(!current)return;
 const {error}=await db.from('gm_messages').insert({
  conversation_id:current.id,sender_id:me.id,content:s,message_type:'sticker'
 });
 if(error)notice(error.message);
 $('stickerPanel').style.display='none';
}

async function editMessage(id){
 const {data:message,error:fetchError}=await db.from('gm_messages').select('content')
  .eq('id',id).eq('sender_id',me.id).maybeSingle();
 if(fetchError||!message){notice('メッセージを取得できません');return}
 const value=prompt('メッセージを編集してください',message.content);
 if(value===null||!value.trim())return;
 const {error}=await db.from('gm_messages').update({
  content:value.trim(),edited_at:new Date().toISOString()
 }).eq('id',id).eq('sender_id',me.id);
 if(error){notice('編集できません: '+error.message);return}
 notice('メッセージを編集しました');
 await loadMessages();
}

async function deleteMessage(id){
 if(!confirm('このメッセージを削除しますか？'))return;
 const {data,error}=await db.from('gm_messages')
  .update({deleted_at:new Date().toISOString()})
  .eq('id',id).eq('conversation_id',current.id).eq('sender_id',me.id)
  .is('deleted_at',null).select('id').maybeSingle();
 if(error){notice('削除できません: '+error.message);return}
 if(!data){notice('削除されませんでした');return}
 notice('メッセージを削除しました');
 await loadMessages();
}

async function reactMessage(id){
 const reaction=prompt('リアクションを入力してください','❤️');
 if(!reaction)return;
 const {error}=await db.from('gm_message_reactions').insert({
  message_id:id,user_id:me.id,reaction:reaction
 });
 if(error){notice('リアクションできません: '+error.message);return}
 notice('リアクションしました');
 await loadMessages();
}

async function hideConversation(){
 if(!current||!confirm('自分のチャット一覧から非表示にしますか？'))return;
 const {error}=await db.from('gm_conversation_hidden').upsert({
  conversation_id:current.id,user_id:me.id,hidden_at:new Date().toISOString()
 },{onConflict:'conversation_id,user_id'});
 if(error){notice('非表示にできません: '+error.message);return}
 $('userPanel').classList.add('hidden');
 backToList();await loadConversations();
 notice('チャットを非表示にしました');
}

async function showHiddenChats(){
 const {data,error}=await db.from('gm_conversation_hidden')
  .select('conversation_id,gm_conversations(title,conversation_type)')
  .eq('user_id',me.id);
 if(error){notice(error.message);return}
 if(!data?.length){notice('非表示のチャットはありません');return}
 showModal('非表示チャット',data.map(x=>
  '<div style="padding:10px;border-bottom:1px solid #eee">'+
  safe(x.gm_conversations?.title||'個別チャット')+
  ' <button class="secondary" onclick="unhideConversation(\''+x.conversation_id+'\')">復元</button></div>'
 ).join(''));
}

async function unhideConversation(id){
 const {error}=await db.from('gm_conversation_hidden').delete()
  .eq('conversation_id',id).eq('user_id',me.id);
 if(error){notice(error.message);return}
 closeModal();await loadConversations();notice('チャットを復元しました');
}

async function toggleBlock(){
 if(!peer?.id){notice('個別チャットで使用してください');return}
 const isBlocked=blockedUsers.has(peer.id);
 if(!confirm(isBlocked?'ブロックを解除しますか？':'このユーザーをブロックしますか？'))return;
 if(isBlocked){
  const {error}=await db.from('gm_blocks').delete()
   .eq('blocker_id',me.id).eq('blocked_id',peer.id);
  if(error){notice(error.message);return}
  blockedUsers.delete(peer.id);notice('ブロックを解除しました');
 }else{
  const {error}=await db.from('gm_blocks').insert({blocker_id:me.id,blocked_id:peer.id});
  if(error){notice(error.message);return}
  blockedUsers.add(peer.id);notice('ブロックしました');
 }
 $('userPanel').classList.add('hidden');
}

async function editProfile(){
 const name=prompt('表示名',me.name);
 if(name===null||!name.trim())return;
 const bio=prompt('自己紹介',me.bio||'');
 if(bio===null)return;
 const {error}=await db.from('profiles').update({
  display_name:name.trim(),bio:bio.trim()
 }).eq('id',me.id);
 if(error){notice('プロフィール更新エラー: '+error.message);return}
 me.name=name.trim();me.bio=bio.trim();
 $('myName').textContent=me.name;
 $('myAvatar').innerHTML=avatar(me.name,me.avatar_url);
 notice('プロフィールを更新しました');
}

function uploadAvatar(){
 const input=document.createElement('input');
 input.type='file';input.accept='image/*';
 input.onchange=async()=>{
  const file=input.files?.[0];if(!file)return;
  if(file.size>5*1024*1024){notice('画像は5MB以下にしてください');return}
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
  const path=me.id+'/avatars/'+Date.now()+'.'+ext;
  const {error:uploadError}=await db.storage.from('gm-media').upload(path,file,{upsert:true,contentType:file.type});
  if(uploadError){notice(uploadError.message);return}
  const {data}=db.storage.from('gm-media').getPublicUrl(path);
  const {error}=await db.from('profiles').update({avatar_url:data.publicUrl}).eq('id',me.id);
  if(error){notice(error.message);return}
  me.avatar_url=data.publicUrl;
  $('myAvatar').innerHTML=avatar(me.name,me.avatar_url);
  notice('プロフィール画像を更新しました');
 };
 input.click();
}

async function createGroup(){
 const title=prompt('グループ名を入力してください');
 if(!title?.trim())return;
 const names=prompt('招待するメンバーの表示名をカンマ区切りで入力してください\n例：山田,佐藤\n自分だけで作る場合は空欄');
 if(names===null)return;
 const ids=[];
 for(const n of names.split(',').map(x=>x.trim()).filter(Boolean)){
  const {data,error}=await db.from('profiles').select('id,display_name')
   .ilike('display_name','%'+n+'%').neq('id',me.id).limit(1);
  if(error){notice(error.message);return}
  if(data?.[0])ids.push(data[0].id);
 }
 const {data,error}=await db.rpc('gm_create_group_chat',{
  p_title:title.trim(),p_member_ids:ids
 });
 if(error){notice('グループ作成エラー: '+error.message);return}
 await loadConversations();
 const c=conversations.find(x=>x.id===data);
 if(c)await openChat(c);
 else{
  const fallback={id:data,name:title.trim(),title:title.trim(),type:'group'};
  await openChat(fallback);
 }
 $('userPanel').classList.add('hidden');
 notice('グループを作成しました');
}

async function showGroupMembers(){
 if(!current||current.type!=='group'){notice('グループチャットで使用してください');return}
 const {data,error}=await db.from('gm_conversation_members')
  .select('user_id,profiles(display_name)')
  .eq('conversation_id',current.id);
 if(error){notice(error.message);return}
 showModal('グループメンバー',(data||[]).map(x=>
  '<p>'+safe(x.profiles?.display_name||'ユーザー')+(x.user_id===me.id?'（自分）':'')+'</p>'
 ).join('')||'メンバーがいません');
}

async function leaveGroup(){
 if(!current||current.type!=='group'){notice('グループチャットで使用してください');return}
 if(!confirm('このグループから退出しますか？'))return;
 const {error}=await db.rpc('gm_leave_group_chat',{p_conversation_id:current.id});
 if(error){notice('退出できません: '+error.message);return}
 backToList();await loadConversations();notice('グループから退出しました');
}

async function reportUser(){
 if(!peer?.id){notice('通報する相手を選択してください');return}
 const reason=prompt('通報理由を入力してください');
 if(!reason?.trim())return;
 const {error}=await db.from('gm_reports').insert({
  reporter_id:me.id,reported_user_id:peer.id,reason:reason.trim()
 });
 if(error){notice('通報できません: '+error.message);return}
 notice('通報を受け付けました');
 $('userPanel').classList.add('hidden');
}

async function reportMessage(id){
 const reason=prompt('このメッセージの通報理由を入力してください');
 if(!reason?.trim())return;
 const {data:message}=await db.from('gm_messages').select('sender_id').eq('id',id).maybeSingle();
 const {error}=await db.from('gm_reports').insert({
  reporter_id:me.id,reported_user_id:message?.sender_id||null,
  message_id:id,reason:reason.trim()
 });
 if(error){notice('通報できません: '+error.message);return}
 notice('通報を受け付けました');
}

async function updatePresence(){
 if(!me)return;
 const now=new Date().toISOString();
 const {error}=await db.from('gm_user_presence').upsert({
  user_id:me.id,is_online:true,last_seen_at:now
 },{onConflict:'user_id'});
 if(error)console.error('presence',error);
 await db.from('profiles').update({is_online:true,last_seen_at:now}).eq('id',me.id);
}

function startPresence(){
 if(presenceTimer)clearInterval(presenceTimer);
 presenceTimer=setInterval(updatePresence,30000);
}

async function updatePeerPresence(){
 if(!peer?.id)return;
 const {data}=await db.from('gm_user_presence').select('is_online,last_seen_at')
  .eq('user_id',peer.id).maybeSingle();
 if(data?.is_online){
  $('peerStatus').innerHTML='<span class="online-dot"></span>オンライン';
 }else if(data?.last_seen_at){
  $('peerStatus').innerHTML='<span class="offline-dot"></span>最終ログイン '+new Date(data.last_seen_at).toLocaleString('ja-JP');
 }else{
  $('peerStatus').textContent='GATE MESSAGE';
 }
}

async function logout(){
 if(presenceTimer)clearInterval(presenceTimer);
 if(me){
  const now=new Date().toISOString();
  await db.from('gm_user_presence').upsert({user_id:me.id,is_online:false,last_seen_at:now},{onConflict:'user_id'});
  await db.from('profiles').update({is_online:false,last_seen_at:now}).eq('id',me.id);
 }
 if(messagesChannel)await db.removeChannel(messagesChannel);
 if(listChannel)await db.removeChannel(listChannel);
 await db.auth.signOut();
 location.reload();
}

buildStickers();

db.auth.getSession().then(({data})=>{
 if(data.session)startApp(data.session.user);
});

db.auth.onAuthStateChange((event,session)=>{
 if(event==='SIGNED_OUT'){
  me=null;
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
 }
});

window.addEventListener('beforeunload',()=>{
 if(me){
  db.from('gm_user_presence').upsert({
   user_id:me.id,is_online:false,last_seen_at:new Date().toISOString()
  },{onConflict:'user_id'});
 }
});
</script>
