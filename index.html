<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GATE MESSAGE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
 --blue:#168cff;--bg:#f3f6fb;--panel:#fff;--text:#172033;
 --muted:#8994a7;--line:#e5eaf1;--bubble:#fff;
}
body.dark{
 --bg:#101725;--panel:#192437;--text:#edf4ff;
 --muted:#9baac0;--line:#2b3b52;--bubble:#24334a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
 font-family:Arial,"Noto Sans JP",sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;
 justify-content:center;padding:20px;
 background:linear-gradient(140deg,#06162d,#087cff)}
.login-card{width:100%;max-width:390px;background:white;color:#172033;
 padding:30px;border-radius:22px;box-shadow:0 15px 60px #001b4540}
.logo{font-size:24px;font-weight:900;letter-spacing:1px}
.logo span{color:var(--blue)}
.gate-logo{display:inline-flex;align-items:center;gap:8px}
.torii{width:35px;height:35px;filter:drop-shadow(0 0 7px #168cff)}
.sub{color:#8994a7;font-size:13px;margin:8px 0 22px}
.field{width:100%;padding:13px;border:1px solid #e5eaf1;
 border-radius:11px;margin:7px 0;outline:none}
.primary{background:var(--blue);color:white;border:0;padding:12px;
 border-radius:11px;font-weight:bold;width:100%;margin-top:9px}
.secondary{background:#e8f2ff;color:#087cff;border:0;
 padding:10px;border-radius:10px}
.danger{background:#ffe9e9;color:#d22;border:0;padding:10px;border-radius:10px}
#app{max-width:1400px;margin:auto;height:100dvh;display:flex;
 background:var(--panel);overflow:hidden}
.sidebar{width:350px;min-width:290px;border-right:1px solid var(--line);
 display:flex;flex-direction:column;background:var(--panel)}
.top{padding:16px;border-bottom:1px solid var(--line)}
.topline{display:flex;justify-content:space-between;align-items:center}
.search{width:100%;padding:12px;border:0;background:var(--bg);
 color:var(--text);border-radius:11px;margin-top:14px;outline:none}
.tabs{display:flex;gap:15px;margin-top:14px;font-size:13px;
 color:var(--muted);flex-wrap:wrap}
.tabs span{cursor:pointer}
.tabs span:hover{color:var(--blue)}
#chatList{overflow:auto;flex:1}
.chat-item{display:flex;align-items:center;gap:11px;padding:12px 14px;
 cursor:pointer;border-bottom:1px solid var(--line)}
.chat-item:hover{background:var(--bg)}
.avatar{width:45px;height:45px;flex-shrink:0;border-radius:50%;
 background:#dceaff;display:flex;align-items:center;
 justify-content:center;color:#087cff;font-weight:bold;
 font-size:18px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.chat-info{flex:1;min-width:0}
.chat-name{font-weight:bold;font-size:14px}
.chat-preview{color:var(--muted);font-size:12px;margin-top:5px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:10px;color:var(--muted)}
.main{flex:1;display:flex;flex-direction:column;min-width:0;
 background:var(--panel)}
.chat-header{height:70px;border-bottom:1px solid var(--line);
 display:flex;align-items:center;padding:0 15px;gap:10px}
.chat-header-info{flex:1;min-width:0}
.chat-header-name{font-weight:bold}
.chat-status{font-size:11px;color:var(--muted);margin-top:4px}
.icon-btn{border:0;background:transparent;font-size:20px;padding:8px;
 color:var(--muted);border-radius:10px}
#messages{flex:1;overflow-y:auto;padding:20px;display:flex;
 flex-direction:column;gap:12px;background:var(--bg)}
.msg-row{display:flex;flex-direction:column;max-width:78%;align-items:flex-start}
.msg-row.mine{align-self:flex-end;align-items:flex-end}
.bubble{background:var(--bubble);padding:11px 14px;border-radius:16px;
 box-shadow:0 1px 4px #0000000a;font-size:14px;line-height:1.6;
 overflow-wrap:anywhere}
.mine .bubble{background:var(--blue);color:white;border-bottom-right-radius:5px}
.msg-meta{font-size:10px;color:var(--muted);margin-top:4px}
.bubble img,.bubble video{display:block;max-width:100%;max-height:320px;
 border-radius:12px}
.sticker{font-size:55px;padding:7px}
.msg-actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.msg-actions button{border:0;background:var(--bg);color:var(--muted);
 border-radius:8px;padding:5px 8px;font-size:11px}
.composer{border-top:1px solid var(--line);padding:11px 15px 15px;
 background:var(--panel)}
.tools{display:flex;gap:7px;margin-bottom:9px;flex-wrap:wrap}
.tool{border:0;background:var(--bg);color:var(--text);
 border-radius:9px;padding:8px 10px;font-size:13px}
.sendline{display:flex;align-items:center;gap:9px}
#messageInput{flex:1;border:0;background:var(--bg);color:var(--text);
 border-radius:22px;padding:13px 16px;outline:none;min-width:0}
.send{background:var(--blue);color:white;border:0;border-radius:50%;
 width:44px;height:44px}
.empty{margin:auto;text-align:center;color:var(--muted);padding:25px}
#mobileBack{display:none}
#userPanel{position:fixed;right:18px;top:65px;background:var(--panel);
 padding:10px;border:1px solid var(--line);border-radius:14px;
 box-shadow:0 10px 30px #0002;z-index:20;min-width:220px;
 max-height:80vh;overflow:auto}
.menu-btn{display:block;width:100%;padding:11px;text-align:left;
 border:0;background:transparent;color:var(--text);
 border-radius:8px;font-size:13px}
.menu-btn:hover{background:var(--bg)}
#notice{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
 background:#172033;color:white;padding:12px 18px;border-radius:12px;
 z-index:50;font-size:13px;max-width:90%;display:none}
.modal{position:fixed;inset:0;background:#0008;z-index:30;
 display:flex;align-items:center;justify-content:center;padding:15px}
.modal-card{background:var(--panel);color:var(--text);
 border-radius:18px;padding:22px;width:100%;max-width:440px;
 max-height:85vh;overflow:auto}
.modal-card h3{margin-top:0}
.modal-card input{width:100%;padding:12px;border:1px solid var(--line);
 border-radius:10px;background:var(--bg);color:var(--text);margin:7px 0}
.modal-actions{display:flex;gap:8px;margin-top:12px}
.modal-actions button{flex:1}
.friend-code{font-size:22px;font-weight:bold;letter-spacing:3px;
 text-align:center;padding:12px;color:var(--blue)}
#qrCode{display:flex;justify-content:center;padding:15px}
.online-dot{display:inline-block;width:8px;height:8px;
 background:#25bd70;border-radius:50%;margin-right:5px}
.context-menu{position:fixed;z-index:60;background:var(--panel);
 border:1px solid var(--line);border-radius:12px;padding:7px;
 box-shadow:0 8px 30px #0003;min-width:190px}
.context-menu button{display:block;width:100%;text-align:left;
 padding:11px;border:0;background:transparent;color:var(--text);
 border-radius:7px}
.context-menu button:hover{background:var(--bg)}
@media(max-width:700px){
 #app{height:100dvh}
 .sidebar{width:100%;min-width:0;border:0}
 .main{display:none;width:100%}
 #app.in-chat .sidebar{display:none}
 #app.in-chat .main{display:flex}
 #mobileBack{display:block}
 .chat-header{height:64px;padding:0 8px}
 #messages{padding:13px}
 .msg-row{max-width:88%}
 .composer{padding:9px}
 .top{padding:13px}
}
</style>
</head>
<body>

<section id="login">
 <div class="login-card">
  <div class="gate-logo">
   <svg class="torii" viewBox="0 0 100 100" fill="none"
    stroke="#168cff" stroke-width="7" stroke-linecap="round">
    <path d="M12 25 Q50 12 88 25"/>
    <path d="M20 34 H80 M28 34 V85 M72 34 V85 M20 48 H80"/>
   </svg>
   <div class="logo">GATE <span>MESSAGE</span></div>
  </div>
  <div class="sub">Connect with everyone.</div>
  <input id="email" class="field" type="email" placeholder="メールアドレス">
  <input id="password" class="field" type="password" placeholder="パスワード">
  <button class="primary" onclick="login()">ログイン</button>
  <p id="loginError" style="color:#e44;font-size:12px"></p>
 </div>
</section>

<div id="app" class="hidden">
 <aside class="sidebar">
  <div class="top">
   <div class="topline">
    <div class="logo">GATE <span>MESSAGE</span></div>
    <button class="icon-btn" onclick="showFriendCode()">＋</button>
   </div>
   <input class="search" id="search" placeholder="チャットを検索"
    oninput="renderList(this.value)">
   <div class="tabs">
    <span onclick="showChats()">チャット</span>
    <span onclick="showFriends()">友だち</span>
    <span onclick="showHiddenChats()">非表示</span>
    <span onclick="showFriendCode()">友だち追加 ＋</span>
   </div>
  </div>
  <div id="chatList"></div>
  <div style="padding:12px;border-top:1px solid var(--line);
   display:flex;align-items:center;gap:9px">
   <div class="avatar" id="myAvatar">G</div>
   <div style="flex:1;min-width:0">
    <b id="myName">ユーザー</b>
    <div style="font-size:11px;color:var(--muted)">GATE MESSAGE</div>
   </div>
   <button class="icon-btn" onclick="toggleMenu()">⚙</button>
  </div>
 </aside>

 <main class="main">
  <header class="chat-header">
   <button class="icon-btn" id="mobileBack" onclick="backToList()">‹</button>
   <div class="avatar" id="peerAvatar">G</div>
   <div class="chat-header-info">
    <div class="chat-header-name" id="peerName">チャット</div>
    <div class="chat-status" id="peerStatus">GATE MESSAGE</div>
   </div>
   <button class="icon-btn" onclick="callNotice('音声通話機能は準備中です')">☎</button>
   <button class="icon-btn" onclick="callNotice('ビデオ通話機能は準備中です')">▣</button>
   <button class="icon-btn" onclick="toggleMenu()">⋯</button>
  </header>

  <div id="messages">
   <div class="empty">会話を選択してください</div>
  </div>

  <div class="composer">
   <div class="tools">
    <button class="tool" onclick="$('photoFile').click()">📷 写真</button>
    <button class="tool" onclick="$('videoFile').click()">🎥 動画</button>
    <button class="tool" onclick="toggleStickers()">😊 スタンプ</button>
   </div>
   <div id="stickerPanel" class="hidden">
    <div id="stickerGrid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px"></div>
   </div>
   <div class="sendline">
    <input id="messageInput" placeholder="メッセージを入力..."
     onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}">
    <button class="send" onclick="sendMessage()">➤</button>
   </div>
   <input id="photoFile" type="file" accept="image/*" multiple hidden
    onchange="uploadMedia(this,'image')">
   <input id="videoFile" type="file" accept="video/mp4,video/webm" multiple hidden
    onchange="uploadMedia(this,'video')">
  </div>
 </main>
</div>

<div id="userPanel" class="hidden">
 <button class="menu-btn" onclick="editProfile()">プロフィール編集</button>
 <button class="menu-btn" onclick="uploadAvatar()">プロフィール画像変更</button>
 <button class="menu-btn" onclick="showFriendCode()">友だちコード・QR</button>
 <button class="menu-btn" onclick="createGroup()">グループ作成</button>
 <button class="menu-btn" onclick="showGroupMembers()">グループメンバー</button>
 <button class="menu-btn" onclick="leaveGroup()">グループ退出</button>
 <button class="menu-btn" onclick="hideConversation()">チャットを非表示</button>
 <button class="menu-btn" onclick="deleteConversation()">自分の一覧から削除</button>
 <button class="menu-btn" onclick="toggleBlock()">ブロック・解除</button>
 <button class="menu-btn" onclick="reportUser()">ユーザーを通報</button>
 <button class="menu-btn" onclick="toggleTheme()">白・黒テーマ切替</button>
 <button class="menu-btn" onclick="logout()">ログアウト</button>
 <button class="menu-btn" onclick="toggleMenu()">閉じる</button>
</div>

<div id="modal" class="modal hidden">
 <div class="modal-card">
  <h3 id="modalTitle">確認</h3>
  <div id="modalBody"></div>
  <div class="modal-actions">
   <button class="secondary" onclick="closeModal()">閉じる</button>
  </div>
 </div>
</div>
<div id="notice"></div>
<div id="contextMenu" class="context-menu hidden"></div>

<script>
const SUPABASE_URL='https://hxrtpftlklgwesvanlpk.supabase.co';
const SUPABASE_KEY='sb_publishable_b1tG9o1bXMzZBXGHBJZhZA_Ak-KYmnZ';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let me=null,current=null,peer=null;
let messagesChannel=null,listChannel=null;
let conversations=[],friends=[],blockedUsers=new Set();
let presenceTimer=null,viewMode='chats';

const $=id=>document.getElementById(id);

function notice(t){
 $('notice').textContent=t;
 $('notice').style.display='block';
 clearTimeout(notice.timer);
 notice.timer=setTimeout(()=>$('notice').style.display='none',3000);
}
function callNotice(t){notice(t)}
function safe(s){
 return String(s??'').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}
function avatar(name,url){
 return url?'<img src="'+safe(url)+'" alt="">':
 safe((name||'G').trim().charAt(0).toUpperCase());
}
function closeModal(){$('modal').classList.add('hidden')}
function showModal(title,html){
 $('modalTitle').textContent=title;
 $('modalBody').innerHTML=html;
 $('modal').classList.remove('hidden');
}
function toggleMenu(){$('userPanel').classList.toggle('hidden')}
function toggleTheme(){
 document.body.classList.toggle('dark');
 localStorage.setItem('gm_theme',
  document.body.classList.contains('dark')?'dark':'light');
 notice('テーマを変更しました');
}
if(localStorage.getItem('gm_theme')==='dark')document.body.classList.add('dark');

async function login(){
 const email=$('email').value.trim(),password=$('password').value;
 $('loginError').textContent='';
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error){$('loginError').textContent=error.message;return}
 await startApp(data.user);
}

async function startApp(user){
 me=user;
 const {data:p,error}=await db.from('profiles')
  .select('id,display_name,avatar_url,bio,friend_code')
  .eq('id',me.id).maybeSingle();
 if(error||!p){notice(error?.message||'プロフィールがありません');return}
 me.name=p.display_name||'ユーザー';
 me.avatar_url=p.avatar_url||'';
 me.bio=p.bio||'';
 me.friend_code=p.friend_code||'';
 $('myName').textContent=me.name;
 $('myAvatar').innerHTML=avatar(me.name,me.avatar_url);
 $('login').classList.add('hidden');
 $('app').classList.remove('hidden');
 await loadBlocks();
 await loadFriends();
 await loadConversations();
 await updatePresence();
 startPresence();
 subscribeList();
}

async function loadBlocks(){
 const {data,error}=await db.from('gm_blocks')
  .select('blocked_id').eq('blocker_id',me.id);
 if(error){notice(error.message);return}
 blockedUsers=new Set((data||[]).map(x=>x.blocked_id));
}

async function loadFriends(){
 const {data,error}=await db.from('gm_friends')
  .select('friend_id,profiles(id,display_name,avatar_url)')
  .eq('user_id',me.id);
 if(error){notice('友だち一覧エラー: '+error.message);return}
 const {data:hidden}=await db.from('gm_friend_hidden')
  .select('friend_id').eq('user_id',me.id);
 const hiddenIds=new Set((hidden||[]).map(x=>x.friend_id));
 friends=(data||[]).filter(x=>!hiddenIds.has(x.friend_id))
  .map(x=>x.profiles).filter(Boolean);
}

async function loadConversations(){
 const {data,error}=await db.from('gm_conversation_members')
  .select('conversation_id,gm_conversations(id,conversation_type,title,created_at,gm_conversation_members(user_id,profiles(id,display_name,avatar_url)),gm_messages(id,content,message_type,created_at,sender_id,deleted_at))')
  .eq('user_id',me.id);
 if(error){notice('チャット一覧エラー: '+error.message);return}
 let all=(data||[]).map(row=>{
  const c=row.gm_conversations;if(!c)return null;
  const members=c.gm_conversation_members||[];
  const other=members.find(m=>m.user_id!==me.id);
  const p=other?.profiles;
  const last=(c.gm_messages||[]).sort((a,b)=>
   new Date(b.created_at)-new Date(a.created_at))[0];
  return {
   id:c.id,type:c.conversation_type,title:c.title,
   name:c.conversation_type==='group'?(c.title||'グループ'):
    (p?.display_name||'ユーザー'),
   peerId:other?.user_id,avatar_url:p?.avatar_url||'',
   memberCount:members.length,
   last:last?.deleted_at?'メッセージを削除しました':
    last?.content||'',time:last?.created_at||c.created_at
  };
 }).filter(Boolean);
 const {data:hidden}=await db.from('gm_conversation_hidden')
  .select('conversation_id').eq('user_id',me.id);
 const hiddenIds=new Set((hidden||[]).map(x=>x.conversation_id));
 conversations=all.filter(c=>!hiddenIds.has(c.id));
 if(viewMode==='chats')renderList($('search').value);
}

function showChats(){
 viewMode='chats';
 $('search').placeholder='チャットを検索';
 renderList('');
}
function showFriends(){
 viewMode='friends';
 $('search').placeholder='友だちを検索';
 renderFriends('');
}
function renderList(filter=''){
 const list=$('chatList');list.innerHTML='';
 const rows=conversations.filter(c=>c.name.toLowerCase().includes(filter.toLowerCase()));
 rows.sort((a,b)=>new Date(b.time)-new Date(a.time));
 if(!rows.length){list.innerHTML='<div class="empty">チャットがありません</div>';return}
 rows.forEach(c=>{
  const el=document.createElement('div');el.className='chat-item';
  el.innerHTML='<div class="avatar">'+avatar(c.name,c.avatar_url)+'</div>'+
   '<div class="chat-info"><div class="chat-name">'+safe(c.name)+'</div>'+
   '<div class="chat-preview">'+safe(c.last||'会話を始めましょう')+'</div></div>'+
   '<div class="time">'+new Date(c.time).toLocaleDateString('ja-JP')+'</div>';
  el.onclick=()=>openChat(c);
  addLongPress(el,()=>conversationMenu(c));
  list.appendChild(el);
 });
}
function renderFriends(filter=''){
 const list=$('chatList');list.innerHTML='';
 const rows=friends.filter(p=>(p.display_name||'').toLowerCase().includes(filter.toLowerCase()));
 if(!rows.length){list.innerHTML='<div class="empty">友だちはまだいません<br>友だち追加から登録してください</div>';return}
 rows.forEach(p=>{
  const el=document.createElement('div');el.className='chat-item';
  el.innerHTML='<div class="avatar">'+avatar(p.display_name,p.avatar_url)+'</div>'+
   '<div class="chat-info"><div class="chat-name">'+safe(p.display_name)+'</div>'+
   '<div class="chat-preview">友だち</div></div>';
  el.onclick=()=>createChat(p);
  addLongPress(el,()=>friendMenu(p));
  list.appendChild(el);
 });
}
function addLongPress(el,callback){
 let timer=null,done=false;
 el.addEventListener('touchstart',()=>{
  done=false;timer=setTimeout(()=>{done=true;callback()},600);
 },{passive:true});
 ['touchend','touchmove','touchcancel'].forEach(ev=>
  el.addEventListener(ev,()=>clearTimeout(timer),{passive:true}));
 el.addEventListener('contextmenu',e=>{e.preventDefault();callback()});
}
function showContext(items){
 const box=$('contextMenu');
 box.innerHTML='';
 items.forEach(item=>{
  const b=document.createElement('button');
  b.textContent=item.label;
  b.onclick=()=>{box.classList.add('hidden');item.action()};
  box.appendChild(b);
 });
 box.classList.remove('hidden');
 box.style.left='50%';box.style.top='50%';
 box.style.transform='translate(-50%,-50%)';
}
document.addEventListener('click',e=>{
 if(!e.target.closest('#contextMenu'))$('contextMenu').classList.add('hidden');
});
function conversationMenu(c){
 current=c;
 showContext([
  {label:'チャットを非表示',action:()=>hideConversation()},
  {label:'自分の一覧から削除',action:()=>deleteConversation()},
  {label:'キャンセル',action:()=>{}}
 ]);
}
function friendMenu(p){
 showContext([
  {label:'友だちを非表示',action:()=>hideFriend(p)},
  {label:'友だち登録を削除',action:()=>removeFriend(p)},
  {label:'ブロック',action:()=>blockFriend(p)},
  {label:'キャンセル',action:()=>{}}
 ]);
}

function subscribeList(){
 if(listChannel)db.removeChannel(listChannel);
 listChannel=db.channel('gm-list-'+me.id)
 .on('postgres_changes',{event:'*',schema:'public',table:'gm_messages'},
  ()=>loadConversations()).subscribe();
}

async function showFriendCode(){
 $('userPanel').classList.add('hidden');
 const {data:code,error}=await db.rpc('gm_get_my_friend_code');
 if(error){notice(error.message);return}
 me.friend_code=code;
 showModal('友だちコード・QRコード',
  '<p>あなたの友だちコード</p>'+
  '<div class="friend-code">'+safe(code)+'</div>'+
  '<button class="secondary" onclick="copyCode()">コードをコピー</button>'+
  '<div id="qrCode"></div><hr>'+
  '<p>友だちのコードを入力</p>'+
  '<input id="friendCodeInput" placeholder="友だちコード">'+
  '<button class="primary" onclick="addFriend()">友だちを追加</button>'+
  '<p style="font-size:12px;color:var(--muted)">QRコード読み取りは、相手のコードを入力して追加してください。</p>');
 $('qrCode')
