<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GATE MESSAGE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
 --blue:#3478f6;
 --bg:#f4f6fa;
 --text:#172033;
 --muted:#8792a5;
 --line:#e8ecf2;
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#login{
 min-height:100vh;display:flex;align-items:center;
 justify-content:center;padding:20px;
 background:linear-gradient(140deg,#10213e,#3478f6);
}
.login-card{
 width:100%;max-width:390px;background:white;
 padding:32px;border-radius:24px;
 box-shadow:0 20px 70px #001b4530;
}
.logo{font-size:26px;font-weight:900;letter-spacing:1px}
.logo span{color:var(--blue)}
.sub{color:var(--muted);font-size:13px;margin:8px 0 25px}
.field{
 width:100%;padding:14px;border:1px solid var(--line);
 border-radius:12px;margin:7px 0;outline:none;
}
.field:focus{border-color:var(--blue)}
.primary{
 background:var(--blue);color:white;border:0;
 padding:14px;border-radius:12px;font-weight:bold;
 width:100%;margin-top:12px;
}
#app{
 max-width:1300px;margin:auto;height:100dvh;
 display:flex;background:white;overflow:hidden;
}
.sidebar{
 width:370px;min-width:300px;border-right:1px solid var(--line);
 display:flex;flex-direction:column;
}
.top{
 padding:20px;border-bottom:1px solid var(--line);
}
.topline{display:flex;justify-content:space-between;align-items:center}
.search{
 width:100%;padding:12px 14px;border:0;
 background:var(--bg);border-radius:12px;margin-top:18px;
 outline:none;
}
.tabs{display:flex;gap:20px;margin-top:18px;font-size:13px}
.tabs span{cursor:pointer;color:var(--muted)}
.tabs .active{color:var(--blue);font-weight:bold}
#chatList{overflow:auto;flex:1}
.chat-item{
 display:flex;align-items:center;gap:12px;
 padding:15px 18px;cursor:pointer;
 border-bottom:1px solid #f1f2f5;
}
.chat-item:hover{background:#f7f9fc}
.avatar{
 width:48px;height:48px;flex-shrink:0;
 border-radius:50%;background:#e3edff;
 display:flex;align-items:center;justify-content:center;
 color:var(--blue);font-weight:bold;font-size:19px;
}
.chat-info{flex:1;min-width:0}
.chat-name{font-weight:700;font-size:14px}
.chat-preview{
 color:var(--muted);font-size:12px;
 margin-top:5px;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis;
}
.time{font-size:11px;color:var(--muted)}
.main{
 flex:1;display:flex;flex-direction:column;
 min-width:0;background:white;
}
.chat-header{
 height:75px;border-bottom:1px solid var(--line);
 display:flex;align-items:center;padding:0 20px;gap:12px;
}
.chat-header-info{flex:1}
.chat-header-name{font-weight:bold}
.chat-status{font-size:11px;color:var(--muted);margin-top:4px}
.icon-btn{
 border:0;background:transparent;font-size:21px;
 padding:8px;color:#64748b;border-radius:10px;
}
.icon-btn:hover{background:var(--bg)}
#messages{
 flex:1;overflow-y:auto;padding:24px;
 display:flex;flex-direction:column;gap:13px;
 background:#fafbfe;
}
.day{text-align:center;color:#a1a9b7;font-size:11px;margin:10px}
.msg-row{display:flex;flex-direction:column;max-width:75%;align-items:flex-start}
.msg-row.mine{align-self:flex-end;align-items:flex-end}
.bubble{
 background:white;padding:12px 15px;border-radius:18px;
 box-shadow:0 1px 4px #0000000a;
 font-size:14px;line-height:1.6;overflow-wrap:anywhere;
}
.mine .bubble{
 background:var(--blue);color:white;
 border-bottom-right-radius:5px;
}
.msg-row:not(.mine) .bubble{border-bottom-left-radius:5px}
.msg-meta{font-size:10px;color:#9aa3b2;margin-top:4px}
.mine .msg-meta{text-align:right}
.bubble img,.bubble video{
 display:block;max-width:100%;max-height:320px;
 border-radius:12px;
}
.sticker{font-size:65px;padding:8px}
.composer{
 border-top:1px solid var(--line);
 padding:12px 18px 18px;background:white;
}
.tools{display:flex;gap:8px;margin-bottom:10px}
.tool{
 border:0;background:#f1f4f9;color:#52617a;
 border-radius:10px;padding:8px 12px;font-size:17px;
}
.sendline{display:flex;align-items:center;gap:10px}
#messageInput{
 flex:1;border:0;background:#f2f4f8;
 border-radius:22px;padding:14px 17px;outline:none;
 min-width:0;
}
.send{
 background:var(--blue);color:white;border:0;
 border-radius:50%;width:44px;height:44px;font-size:18px;
}
.empty{
 margin:auto;text-align:center;color:var(--muted);
 padding:25px;
}
.empty strong{display:block;color:#344158;font-size:20px;margin:10px}
#mobileBack{display:none}
#userPanel{
 position:absolute;right:20px;top:70px;background:white;
 padding:18px;border:1px solid var(--line);
 border-radius:15px;box-shadow:0 10px 30px #0002;
 z-index:5;min-width:210px;
}
.menu-btn{
 display:block;width:100%;padding:12px;text-align:left;
 border:0;background:white;border-radius:8px;
}
.menu-btn:hover{background:var(--bg)}
#notice{
 position:fixed;bottom:20px;left:50%;
 transform:translateX(-50%);background:#172033;
 color:white;padding:12px 20px;border-radius:12px;
 z-index:30;font-size:13px;display:none;
}
#stickerPanel{
 display:none;position:absolute;bottom:100px;
 background:white;border:1px solid var(--line);
 box-shadow:0 5px 25px #0002;border-radius:15px;
 padding:15px;max-width:300px;
}
.sticker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sticker-grid button{font-size:30px;border:0;background:#f5f7fa;border-radius:10px;padding:7px}
@media(max-width:700px){
 #app{height:100dvh}
 .sidebar{width:100%;min-width:0;border:0}
 .main{display:none;width:100%}
 #app.in-chat .sidebar{display:none}
 #app.in-chat .main{display:flex}
 #mobileBack{display:block}
 .chat-header{height:65px;padding:0 10px}
 #messages{padding:15px}
 .msg-row{max-width:86%}
 .composer{padding:10px}
 .top{padding:16px}
}
</style>
</head>
<body>

<section id="login">
 <div class="login-card">
  <div class="logo">GATE <span>MESSAGE</span></div>
  <div class="sub">Connect with everyone.</div>
  <input id="email" class="field" type="email" placeholder="メールアドレス">
  <input id="password" class="field" type="password" placeholder="パスワード">
  <button class="primary" onclick="login()">ログイン</button>
  <p id="loginError" style="color:#e44;font-size:12px"></p>
 </div>
</section>

<div id="app" class="hidden">
 <aside class="sidebar">
  <div class="top">
   <div class="topline">
    <div class="logo">GATE <span>MESSAGE</span></div>
    <button class="icon-btn" onclick="newChat()">＋</button>
   </div>
   <input class="search" id="search" placeholder="ユーザー・チャットを検索" oninput="searchAll()">
   <div class="tabs">
    <span class="active">すべて</span>
    <span onclick="newChat()">友だちを探す ＋</span>
   </div>
  </div>
  <div id="chatList"></div>
  <div style="padding:14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px">
   <div class="avatar" id="myAvatar">G</div>
   <div style="flex:1;min-width:0">
    <b id="myName">ユーザー</b>
    <div style="font-size:11px;color:var(--muted)">GATE MESSAGE</div>
   </div>
   <button class="icon-btn" onclick="toggleMenu()">⚙</button>
  </div>
 </aside>

 <main class="main">
  <header class="chat-header">
   <button class="icon-btn" id="mobileBack" onclick="backToList()">‹</button>
   <div class="avatar" id="peerAvatar">G</div>
   <div class="chat-header-info">
    <div class="chat-header-name" id="peerName">チャット</div>
    <div class="chat-status" id="peerStatus">GATE MESSAGE</div>
   </div>
   <button class="icon-btn" onclick="callNotice('通話機能は今後追加予定です')">☎</button>
   <button class="icon-btn" onclick="callNotice('ビデオ通話機能は今後追加予定です')">▣</button>
   <button class="icon-btn" onclick="toggleMenu()">⋯</button>
  </header>
  <div id="messages">
   <div class="empty"><strong>GATE MESSAGE</strong>会話を選択してください</div>
  </div>
  <div class="composer">
   <div class="tools">
    <button class="tool" onclick="document.getElementById('photoFile').click()">📷</button>
    <button class="tool" onclick="document.getElementById('videoFile').click()">🎥</button>
    <button class="tool" onclick="toggleStickers()">😊</button>
    <button class="tool" onclick="callNotice('メッセージを長押しするとリアクションできます')">❤️</button>
   </div>
   <div id="stickerPanel">
    <div class="sticker-grid" id="stickerGrid"></div>
   </div>
   <div class="sendline">
    <input id="messageInput" placeholder="メッセージを入力..."
     onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}">
    <button class="send" onclick="sendMessage()">➤</button>
   </div>
   <input id="photoFile" type="file" accept="image/*" hidden onchange="uploadMedia(this,'image')">
   <input id="videoFile" type="file" accept="video/mp4,video/webm" hidden onchange="uploadMedia(this,'video')">
  </div>
 </main>
</div>

<div id="userPanel" class="hidden">
 <button class="menu-btn" onclick="hideConversation()">チャットを削除（自分の一覧から）</button>
 <button class="menu-btn" onclick="toggleBlock()">ブロック・解除</button>
 <button class="menu-btn" onclick="logout()">ログアウト</button>
 <button class="menu-btn" onclick="toggleMenu()">閉じる</button>
</div>
<div id="notice"></div>

<script>
const SUPABASE_URL='https://hxrtpftlklgwesvanlpk.supabase.co';
const SUPABASE_KEY='sb_publishable_b1tG9o1bXMzZBXGHBJZhZA_Ak-KYmnZ';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let me=null;
let current=null;
let peer=null;
let messagesChannel=null;
let listChannel=null;
let conversations=[];
let blockedUsers=new Set();
let searchTimer=null;

const $=id=>document.getElementById(id);

function notice(text){
 $('notice').textContent=text;
 $('notice').style.display='block';
 setTimeout(()=>$('notice').style.display='none',2800);
}
function callNotice(text){notice(text)}
function safe(s){
 return String(s??'').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}
function avatar(name){
 return safe((name||'G').trim().charAt(0).toUpperCase());
}

async function login(){
 const email=$('email').value.trim();
 const password=$('password').value;
 $('loginError').textContent='';
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error){
  $('loginError').textContent=error.message;
  return;
 }
 await startApp(data.user);
}

async function startApp(user){
 me=user;
 const {data:profile,error}=await db.from('profiles')
  .select('id,display_name').eq('id',me.id).maybeSingle();
 if(error){notice('プロフィールを取得できません: '+error.message);return}
 if(!profile){notice('プロフィールが登録されていません');return}
 me.name=profile.display_name||'ユーザー';
 $('myName').textContent=me.name;
 $('myAvatar').textContent=avatar(me.name);
 $('login').classList.add('hidden');
 $('app').classList.remove('hidden');
 await loadBlocks();
 await loadConversations();
 subscribeList();
}

async function loadBlocks(){
 const {data,error}=await db.from('gm_blocks')
  .select('blocked_id').eq('blocker_id',me.id);
 if(!error)blockedUsers=new Set((data||[]).map(x=>x.blocked_id));
}

async function loadConversations(){
 const {data,error}=await db.from('gm_conversation_members')
  .select('conversation_id,gm_conversations(id,conversation_type,title,created_at,gm_conversation_members(user_id,profiles(id,display_name)),gm_messages(id,content,message_type,created_at,sender_id,deleted_at))')
  .eq('user_id',me.id);
 if(error){notice('チャット一覧の取得に失敗: '+error.message);return}
 conversations=(data||[]).map(row=>{
  const c=row.gm_conversations;
  if(!c)return null;
  const members=c.gm_conversation_members||[];
  const other=members.find(m=>m.user_id!==me.id);
  const p=other?.profiles;
  const last=(c.gm_messages||[]).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];
  return {
   id:c.id,
   name:c.conversation_type==='group'?(c.title||'グループ'):(p?.display_name||'ユーザー'),
   peerId:other?.user_id,
   last:last?.deleted_at?'メッセージを削除しました':last?.content||'',
   time:last?.created_at||c.created_at
  };
 }).filter(Boolean);
 const {data:hidden}=await db.from('gm_conversation_hidden')
  .select('conversation_id').eq('user_id',me.id);
 const hiddenIds=new Set((hidden||[]).map(x=>x.conversation_id));
 conversations=conversations.filter(c=>!hiddenIds.has(c.id));
 renderList();
}

function renderList(filter=''){
 const list=$('chatList');
 const filtered=conversations.filter(c=>c.name.toLowerCase().includes(filter.toLowerCase()));
 list.innerHTML='';
 if(!filtered.length){
  list.innerHTML='<div class="empty">チャットがありません<br>＋からユーザーを探しましょう</div>';
  return;
 }
 filtered.sort((a,b)=>new Date(b.time)-new Date(a.time));
 filtered.forEach(c=>{
  const el=document.createElement('div');
  el.className='chat-item';
  el.innerHTML=`
   <div class="avatar">${avatar(c.name)}</div>
   <div class="chat-info">
    <div class="chat-name">${safe(c.name)}</div>
    <div class="chat-preview">${safe(c.last||'メッセージを始めましょう')}</div>
   </div>
   <div class="time">${new Date(c.time).toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'})}</div>`;
  el.onclick=()=>openChat(c);
  list.appendChild(el);
 });
}

function subscribeList(){
 if(listChannel)db.removeChannel(listChannel);
 listChannel=db.channel('gm-list-'+me.id)
 .on('postgres_changes',{
  event:'*',schema:'public',table:'gm_messages'
 },()=>loadConversations())
 .subscribe();
}

async function newChat(){
 const name=prompt('相手の表示名を入力してください');
 if(!name?.trim())return;
 const {data,error}=await db.from('profiles')
  .select('id,display_name')
  .ilike('display_name','%'+name.trim()+'%')
  .neq('id',me.id).limit(20);
 if(error){notice(error.message);return}
 if(!data?.length){notice('ユーザーが見つかりません');return}
 if(data.length===1){await createChat(data[0]);return}
 const choice=prompt(data.map((p,i)=>(i+1)+'. '+p.display_name).join('\n')+'\n番号を入力');
 const p=data[Number(choice)-1];
 if(p)await createChat(p);
}

async function searchAll(){
 clearTimeout(searchTimer);
 const q=$('search').value.trim();
 renderList(q);
 if(q.length<2)return;
 searchTimer=setTimeout(async()=>{
  const {data,error}=await db.from('profiles')
   .select('id,display_name')
   .ilike('display_name','%'+q+'%')
   .neq('id',me.id).limit(10);
  if(error)return;
  data.forEach(p=>{
   if(conversations.some(c=>c.peerId===p.id))return;
   const el=document.createElement('div');
   el.className='chat-item';
   el.innerHTML='<div class="avatar">'+avatar(p.display_name)+'</div><div class="chat-info"><div class="chat-name">'+safe(p.display_name)+'</div><div class="chat-preview">ユーザー・新しいチャット</div></div>';
   el.onclick=()=>createChat(p);
   $('chatList').prepend(el);
  });
 },300);
}

async function createChat(p){
 if(blockedUsers.has(p.id)){notice('このユーザーはブロック中です');return}
 const {data:blocks}=await db.from('gm_blocks')
  .select('blocker_id').eq('blocker_id',p.id).eq('blocked_id',me.id);
 if(blocks?.length){notice('このユーザーとはチャットできません');return}
 const {data,error}=await db.rpc('gm_start_direct_chat',{p_other_user_id:p.id});
 if(error){notice('チャット作成エラー: '+error.message);return}
 const id=typeof data==='string'?data:data?.id;
 if(!id){notice('チャットIDを取得できません');return}
 await loadConversations();
 const c=conversations.find(x=>x.id===id)||{
  id,name:p.display_name,peerId:p.id,last:'',time:new Date().toISOString()
 };
 await openChat(c);
}

async function openChat(c){
 current=c;
 peer={id:c.peerId,name:c.name};
 $('app').classList.add('in-chat');
 $('peerName').textContent=c.name;
 $('peerAvatar').textContent=avatar(c.name);
 $('peerStatus').textContent='GATE MESSAGE';
 $('messages').innerHTML='';
 await loadMessages();
 if(messagesChannel)await db.removeChannel(messagesChannel);
 messagesChannel=db.channel('gm-room-'+c.id)
 .on('postgres_changes',{
  event:'INSERT',schema:'public',table:'gm_messages',
  filter:'conversation_id=eq.'+c.id
 },async payload=>{
  await renderMessage(payload.new);
  await markRead(payload.new);
 })
 .on('postgres_changes',{
  event:'UPDATE',schema:'public',table:'gm_messages',
  filter:'conversation_id=eq.'+c.id
 },()=>loadMessages())
 .subscribe();
}

function backToList(){
 $('app').classList.remove('in-chat');
 if(messagesChannel){db.removeChannel(messagesChannel);messagesChannel=null}
 current=null;
}

async function loadMessages(){
 if(!current)return;
 const {data,error}=await db.from('gm_messages')
  .select('*').eq('conversation_id',current.id)
  .order('created_at',{ascending:true});
 if(error){notice(error.message);return}
 $('messages').innerHTML='';
 for(const m of data||[])await renderMessage(m);
 $('messages').scrollTop=$('messages').scrollHeight;
 const incoming=(data||[]).filter(m=>m.sender_id!==me.id&&!m.deleted_at);
 for(const m of incoming)await markRead(m);
}

async function renderMessage(m){
 if(!m||!current)return;
 const old=$('msg-'+m.id);
 if(old)old.remove();
 const mine=m.sender_id===me.id;
 const row=document.createElement('div');
 row.id='msg-'+m.id;
 row.className='msg-row'+(mine?' mine':'');
 let body='';
 if(m.deleted_at){
  body='<i>このメッセージは削除されました</i>';
 }else if(m.message_type==='image'){
  body='<img src="'+safe(m.media_url)+'" alt="写真">';
 }else if(m.message_type==='video'){
  body='<video controls playsinline src="'+safe(m.media_url)+'"></video>';
 }else if(m.message_type==='sticker'){
  body='<div class="sticker">'+safe(m.content)+'</div>';
 }else{
  body=safe(m.content).replace(/\n/g,'<br>');
 }
 const {data:reads}=mine?await db.from('gm_message_reads')
  .select('user_id').eq('message_id',m.id).neq('user_id',me.id):{data:[]};
 const readText=mine&&reads?.length?'既読':'';
 row.innerHTML='<div class="bubble">'+body+'</div>'+
 '<div class="msg-meta">'+new Date(m.created_at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+
 (m.edited_at?' 編集':'')+' '+readText+'</div>'+
 '<div style="display:flex;gap:5px;margin-top:4px">'+
 (mine&&!m.deleted_at?'<button class="tool" onclick="deleteMessage(\''+m.id+'\')">削除</button>':'')+
 (!m.deleted_at?'<button class="tool" onclick="reactMessage(\''+m.id+'\')">❤️</button>':'')+
 '</div>';
 $('messages').appendChild(row);
 $('messages').scrollTop=$('messages').scrollHeight;
}

async function markRead(m){
 if(!m||m.sender_id===me.id)return;
 const {error}=await db.from('gm_message_reads').upsert({
  message_id:m.id,user_id:me.id
 },{onConflict:'message_id,user_id',ignoreDuplicates:true});
 if(error)console.error(error);
}

async function sendMessage(){
 if(!current)return;
 const text=$('messageInput').value.trim();
 if(!text)return;
 if(peer?.id&&blockedUsers.has(peer.id)){
  notice('ブロック中のため送信できません');return;
 }
 const {data:blocks}=peer?.id?await db.from('gm_blocks')
  .select('blocker_id').eq('blocker_id',peer.id).eq('blocked_id',me.id):{data:[]};
 if(blocks?.length){notice('相手からブロックされています');return}
 const {error}=await db.from('gm_messages').insert({
  conversation_id:current.id,sender_id:me.id,
  content:text,message_type:'text'
 });
 if(error){notice('送信できません: '+error.message);return}
 $('messageInput').value='';
}

async function uploadMedia(input,type){
 const file=input.files?.[0];
 if(!file||!current)return;
 const max=50*1024*1024;
 if(file.size>max){notice('ファイルは50MB以下にしてください');input.value='';return}
 const ext=file.name.split('.').pop().toLowerCase();
 const path=me.id+'/'+Date.now()+'-'+crypto.randomUUID()+'.'+ext;
 notice('アップロード中...');
 const {error:uploadError}=await db.storage.from('gm-media').upload(path,file,{
  cacheControl:'3600',upsert:false,contentType:file.type
 });
 if(uploadError){notice('アップロード失敗: '+uploadError.message);input.value='';return}
 const {data}=db.storage.from('gm-media').getPublicUrl(path);
 const {error}=await db.from('gm_messages').insert({
  conversation_id:current.id,sender_id:me.id,
  content:type==='image'?'写真を送信しました':'動画を送信しました',
  message_type:type,media_url:data.publicUrl,media_name:file.name
 });
 if(error)notice('送信失敗: '+error.message);
 else notice('送信しました');
 input.value='';
}

const stickers=['😀','😂','🥰','😍','😭','😎','👍','❤️','🎉','🙏','🐱','🐶','🌸','🔥','✨','💯'];
function buildStickers(){
 $('stickerGrid').innerHTML='';
 stickers.forEach(s=>{
  const b=document.createElement('button');
  b.textContent=s;
  b.onclick=()=>sendSticker(s);
  $('stickerGrid').appendChild(b);
 });
}
function toggleStickers(){
 const p=$('stickerPanel');
 p.style.display=p.style.display==='block'?'none':'block';
}
async function sendSticker(s){
 if(!current)return;
 const {error}=await db.from('gm_messages').insert({
  conversation_id:current.id,sender_id:me.id,
  content:s,message_type:'sticker'
 });
 if(error)notice(error.message);
 $('stickerPanel').style.display='none';
}

async function deleteMessage(id){
 if(!confirm('このメッセージを削除しますか？'))return;
 const {error}=await db.from('gm_messages')
  .update({deleted_at:new Date().toISOString()})
  .eq('id',id).eq('sender_id',me.id);
 if(error){notice('削除できません: '+error.message);return}
 notice('削除しました');
 await loadMessages();
}

async function reactMessage(id){
 const reaction=prompt('リアクションを入力してください（❤️ 👍 😂 😮 😢）','❤️');
 if(!reaction)return;
 const {error}=await db.from('gm_message_reactions').insert({
  message_id:id,user_id:me.id,reaction:reaction
 });
 if(error)notice('リアクションできません: '+error.message);
 else notice('リアクションしました');
}

async function hideConversation(){
 if(!current)return;
 if(!confirm('自分のチャット一覧から削除しますか？相手の画面からは削除されません。'))return;
 const {error}=await db.from('gm_conversation_hidden').upsert({
  conversation_id:current.id,user_id:me.id
 });
 if(error){notice(error.message);return}
 $('userPanel').classList.add('hidden');
 backToList();
 await loadConversations();
 notice('チャットを非表示にしました');
}

async function toggleBlock(){
 if(!peer?.id)return;
 const isBlocked=blockedUsers.has(peer.id);
 if(!confirm(isBlocked?'ブロックを解除しますか？':'このユーザーをブロックしますか？'))return;
 if(isBlocked){
  const {error}=await db.from('gm_blocks')
   .delete().eq('blocker_id',me.id).eq('blocked_id',peer.id);
  if(error){notice(error.message);return}
  blockedUsers.delete(peer.id);
  notice('ブロックを解除しました');
 }else{
  const {error}=await db.from('gm_blocks').insert({
   blocker_id:me.id,blocked_id:peer.id
  });
  if(error){notice(error.message);return}
  blockedUsers.add(peer.id);
  notice('ブロックしました');
 }
 $('userPanel').classList.add('hidden');
}

function toggleMenu(){
 $('userPanel').classList.toggle('hidden');
}
async function logout(){
 if(messagesChannel)await db.removeChannel(messagesChannel);
 if(listChannel)await db.removeChannel(listChannel);
 await db.auth.signOut();
 location.reload();
}

buildStickers();

db.auth.getSession().then(({data})=>{
 if(data.session)startApp(data.session.user);
});
db.auth.onAuthStateChange((event,session)=>{
 if(event==='SIGNED_OUT'){
  me=null;
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
 }
});
</script>
</body>
</html>
