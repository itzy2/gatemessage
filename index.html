<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101d35">
<title>GATE MESSAGE | GATE SQUARE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --navy:#101d35;
  --navy2:#172b4d;
  --cyan:#35d9f5;
  --blue:#2385ff;
  --bg:#eef3f9;
  --white:#fff;
  --text:#18243a;
  --muted:#8793a6;
  --border:#e4eaf2;
  --green:#19b982;
  --red:#e55364;
}

* { box-sizing:border-box; }

body {
  margin:0;
  font-family:Arial,"Noto Sans JP",sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,textarea {
  font:inherit;
}

button {
  cursor:pointer;
}

button:disabled {
  opacity:.55;
  cursor:not-allowed;
}

.hidden {
  display:none !important;
}

/* ログイン */

.auth-screen {
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 20% 20%,#164b72 0,transparent 35%),
    linear-gradient(135deg,#0c172b,#172c4b);
}

.auth-card {
  width:100%;
  max-width:420px;
  padding:35px;
  background:#ffffff;
  border-radius:22px;
  box-shadow:0 25px 70px #0005;
}

.logo {
  text-align:center;
  margin-bottom:28px;
}

.logo-icon {
  width:65px;
  height:65px;
  margin:auto;
  display:grid;
  place-items:center;
  background:var(--navy);
  color:var(--cyan);
  border-radius:20px;
  font-size:30px;
}

.logo h1 {
  margin:14px 0 5px;
  letter-spacing:2px;
  font-size:25px;
}

.logo p {
  color:var(--muted);
  font-size:12px;
  letter-spacing:2px;
}

.auth-card label {
  display:block;
  font-size:13px;
  font-weight:bold;
  margin:15px 0 7px;
}

.auth-card input {
  width:100%;
  padding:14px;
  border:1px solid var(--border);
  border-radius:10px;
  outline:none;
}

.auth-card input:focus {
  border-color:var(--cyan);
}

.primary-btn {
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  color:white;
  font-weight:bold;
  background:linear-gradient(100deg,#1479e9,#19bfdc);
  margin-top:18px;
}

.secondary-btn {
  padding:10px 14px;
  border:1px solid var(--border);
  background:white;
  border-radius:9px;
  color:var(--text);
}

.auth-switch {
  margin-top:18px;
  text-align:center;
  font-size:13px;
  color:#2586dd;
  cursor:pointer;
}

.message {
  font-size:13px;
  margin-top:12px;
  line-height:1.6;
  overflow-wrap:anywhere;
}

/* アプリ全体 */

.app {
  height:100dvh;
  display:flex;
  flex-direction:column;
  max-width:1500px;
  margin:auto;
  background:white;
}

.header {
  min-height:65px;
  background:var(--navy);
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  border-bottom:2px solid var(--cyan);
}

.header-brand {
  display:flex;
  align-items:center;
  gap:12px;
  font-size:19px;
  font-weight:bold;
  letter-spacing:1px;
}

.header-brand span {
  color:var(--cyan);
}

.header-user {
  display:flex;
  align-items:center;
  gap:12px;
  font-size:13px;
}

.header-user button {
  border:1px solid #ffffff55;
  background:transparent;
  color:white;
  padding:8px 12px;
  border-radius:8px;
}

.main {
  display:grid;
  grid-template-columns:340px 1fr;
  flex:1;
  min-height:0;
}

/* 左側 */

.sidebar {
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  min-height:0;
}

.sidebar-top {
  padding:20px;
  border-bottom:1px solid var(--border);
}

.sidebar-title {
  font-size:20px;
  font-weight:bold;
  margin-bottom:15px;
}

.search-box {
  width:100%;
  border:1px solid var(--border);
  background:#f5f8fc;
  padding:12px;
  border-radius:10px;
  outline:none;
}

.search-results {
  margin-top:10px;
  max-height:180px;
  overflow:auto;
}

.user-result {
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
}

.user-result:hover {
  background:#eef7fc;
}

.avatar {
  width:42px;
  height:42px;
  flex-shrink:0;
  display:grid;
  place-items:center;
  border-radius:50%;
  color:white;
  font-weight:bold;
  background:linear-gradient(135deg,#176fbd,#31c8df);
}

.user-result-info {
  min-width:0;
  flex:1;
}

.user-result-info strong {
  display:block;
  font-size:14px;
}

.user-result-info small {
  color:var(--muted);
  font-size:11px;
}

.section-heading {
  padding:17px 20px 8px;
  font-size:12px;
  font-weight:bold;
  color:var(--muted);
  letter-spacing:1px;
}

.conversation-list {
  overflow:auto;
  flex:1;
}

.conversation-item {
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 18px;
  cursor:pointer;
  border-bottom:1px solid #f0f3f7;
}

.conversation-item:hover {
  background:#f4f8fc;
}

.conversation-item.active {
  background:#eaf7fc;
  border-left:4px solid var(--cyan);
  padding-left:14px;
}

.conversation-info {
  flex:1;
  min-width:0;
}

.conversation-info strong {
  display:block;
  font-size:14px;
  margin-bottom:5px;
}

.conversation-info small {
  color:var(--muted);
  font-size:12px;
  display:block;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

/* 右側トーク */

.chat {
  display:flex;
  flex-direction:column;
  min-width:0;
  min-height:0;
}

.chat-empty {
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:var(--muted);
  text-align:center;
  padding:25px;
}

.chat-empty .big-icon {
  font-size:60px;
  color:#b6d8e9;
  margin-bottom:15px;
}

.chat-header {
  padding:16px 22px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--border);
  min-height:75px;
}

.chat-header-info {
  flex:1;
}

.chat-header-info strong {
  display:block;
  font-size:16px;
}

.chat-header-info small {
  color:var(--muted);
  font-size:12px;
}

.messages {
  flex:1;
  overflow-y:auto;
  padding:24px;
  background:#f7f9fc;
  display:flex;
  flex-direction:column;
  gap:13px;
}

.date-divider {
  text-align:center;
  color:var(--muted);
  font-size:11px;
  margin:8px 0;
}

.message-row {
  display:flex;
  flex-direction:column;
  max-width:75%;
  align-self:flex-start;
}

.message-row.mine {
  align-self:flex-end;
  align-items:flex-end;
}

.message-sender {
  font-size:11px;
  color:var(--muted);
  margin:0 5px 5px;
}

.bubble {
  padding:12px 15px;
  border-radius:16px;
  background:white;
  box-shadow:0 2px 7px #10243b0c;
  font-size:14px;
  line-height:1.65;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
}

.mine .bubble {
  background:#d9f7ff;
  border-bottom-right-radius:4px;
}

.message-time {
  color:#a1aabb;
  font-size:10px;
  margin:4px 5px 0;
}

.input-area {
  padding:15px 20px;
  border-top:1px solid var(--border);
  display:flex;
  align-items:flex-end;
  gap:10px;
}

.input-area textarea {
  flex:1;
  min-height:45px;
  max-height:120px;
  resize:none;
  padding:13px;
  border:1px solid var(--border);
  border-radius:12px;
  outline:none;
  font-size:14px;
}

.input-area textarea:focus {
  border-color:var(--cyan);
}

.send-btn {
  width:48px;
  height:45px;
  border:0;
  border-radius:12px;
  color:white;
  background:linear-gradient(135deg,#1684eb,#20c6df);
  font-size:20px;
}

.send-btn:disabled {
  opacity:.5;
  cursor:not-allowed;
}

.status {
  padding:7px 12px;
  font-size:11px;
  color:var(--muted);
  background:#f7f9fc;
  border-top:1px solid var(--border);
}

/* スマートフォン */

@media(max-width:700px) {
  .header {
    padding:0 12px;
    min-height:58px;
  }

  .header-brand {
    font-size:16px;
  }

  .header-user {
    gap:6px;
    font-size:11px;
  }

  .header-user button {
    padding:7px;
    font-size:11px;
  }

  .main {
    grid-template-columns:1fr;
    position:relative;
  }

  .sidebar {
    border:0;
  }

  .chat {
    display:none;
  }

  .main.chat-open .sidebar {
    display:none;
  }

  .main.chat-open .chat {
    display:flex;
  }

  .back-btn {
    display:block !important;
  }

  .messages {
    padding:16px 12px;
  }

  .message-row {
    max-width:85%;
  }

  .input-area {
    padding:10px;
  }

  .auth-card {
    padding:25px;
  }
}

.back-btn {
  display:none;
  border:0;
  background:#edf4fa;
  padding:9px 12px;
  border-radius:8px;
}
</style>
</head>

<body>

<!-- ログイン・登録 -->

<section id="authScreen" class="auth-screen">
  <div class="auth-card">

    <div class="logo">
      <div class="logo-icon">✉</div>
      <h1>GATE MESSAGE</h1>
      <p>GATE SQUARE COMMUNICATION</p>
    </div>

    <div id="loginForm">
      <label>メールアドレス</label>
      <input id="loginEmail" type="email"
        placeholder="メールアドレス" autocomplete="username">

      <label>パスワード</label>
      <input id="loginPassword" type="password"
        placeholder="パスワード" autocomplete="current-password">

      <button class="primary-btn" id="loginButton" type="button">
        ログイン
      </button>

      <div class="auth-switch" id="showSignup">
        アカウントを新規登録する
      </div>
    </div>

    <div id="signupForm" class="hidden">
      <label>表示名</label>
      <input id="signupName" type="text" maxlength="40"
        placeholder="あなたの名前">

      <label>メールアドレス</label>
      <input id="signupEmail" type="email"
        placeholder="メールアドレス" autocomplete="username">

      <label>パスワード（6文字以上）</label>
      <input id="signupPassword" type="password"
        placeholder="パスワード" autocomplete="new-password">

      <button class="primary-btn" id="signupButton" type="button">
        アカウントを作成
      </button>

      <div class="auth-switch" id="showLogin">
        ログイン画面に戻る
      </div>
    </div>

    <div id="authMessage" class="message"></div>

  </div>
</section>


<!-- メインアプリ -->

<section id="appScreen" class="app hidden">

  <header class="header">
    <div class="header-brand">
      ✉ <span>GATE</span> MESSAGE
    </div>

    <div class="header-user">
      <span id="headerName">ユーザー</span>
      <button id="logoutButton" type="button">ログアウト</button>
    </div>
  </header>

  <main class="main" id="mainLayout">

    <aside class="sidebar">

      <div class="sidebar-top">
        <div class="sidebar-title">メッセージ</div>

        <input
          id="userSearch"
          class="search-box"
          type="text"
          placeholder="ユーザー名を検索..."
          autocomplete="off"
        >

        <div id="searchResults" class="search-results"></div>
      </div>

      <div class="section-heading">CHATS / トーク一覧</div>

      <div id="conversationList" class="conversation-list">
        <div style="padding:20px;color:#8793a6;font-size:13px">
          トークを読み込み中...
        </div>
      </div>

    </aside>

    <section class="chat">

      <div id="chatEmpty" class="chat-empty">
        <div class="big-icon">✉</div>
        <strong>GATE MESSAGE</strong>
        <p>左側からユーザーを検索して<br>トークを開始してください。</p>
      </div>

      <div id="chatContent" class="hidden"
        style="display:flex;flex-direction:column;flex:1;min-height:0">

        <div class="chat-header">
          <button class="back-btn" id="backButton" type="button">戻る</button>

          <div class="avatar" id="chatAvatar">G</div>

          <div class="chat-header-info">
            <strong id="chatTitle">トーク</strong>
            <small id="chatSubtitle">GATE MESSAGE</small>
          </div>
        </div>

        <div id="messages" class="messages"></div>

        <div class="input-area">
          <textarea
            id="messageInput"
            placeholder="メッセージを入力..."
            maxlength="10000"
            rows="1"
          ></textarea>

          <button class="send-btn" id="sendButton"
            type="button" title="送信">➤</button>
        </div>

      </div>

      <div class="status" id="statusBar">
        GATE MESSAGE / SECURE CHAT
      </div>

    </section>

  </main>

</section>


<script>
/* =========================================
   Supabase設定
========================================= */

const SUPABASE_URL =
  "https://hxrtpftlklgwesvanlpk.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_b1tG9o1bXMzZBXGHBJZhZA_Ak-KYmnZ";

let supabase = null;

if (window.supabase?.createClient) {
  supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );
}


/* =========================================
   状態管理
========================================= */

let currentUser = null;
let currentProfile = null;
let currentConversation = null;
let currentConversationName = "";
let messageSubscription = null;
let conversationsCache = [];

let loginRunning = false;
let signupRunning = false;
let appReadyUserId = null;
let activationPromise = null;
let signingOut = false;

let searchTimer = null;

const $ = id => document.getElementById(id);


/* =========================================
   共通関数
========================================= */

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}

function showAuthMessage(text, error = false) {
  $("authMessage").textContent = text || "";
  $("authMessage").style.color =
    error ? "#e55364" : "#19a879";
}

function setStatus(text) {
  $("statusBar").textContent = text;
}

function formatTime(value) {
  if (!value) return "";

  return new Date(value).toLocaleTimeString("ja-JP", {
    hour:"2-digit",
    minute:"2-digit"
  });
}

function getInitial(name) {
  return (name || "G").trim().charAt(0).toUpperCase();
}

function showLoginScreen(message = "") {
  $("appScreen").classList.add("hidden");
  $("authScreen").classList.remove("hidden");

  $("loginButton").disabled = false;
  $("loginButton").textContent = "ログイン";

  showAuthMessage(message);
}

function showAppScreen() {
  $("authScreen").classList.add("hidden");
  $("appScreen").classList.remove("hidden");
}


/* =========================================
   Supabase読み込み確認
========================================= */

if (!supabase) {
  showAuthMessage(
    "Supabaseの読み込みに失敗しました。インターネット接続を確認してページを再読み込みしてください。",
    true
  );
}


/* =========================================
   ログイン・新規登録画面
========================================= */

$("showSignup").addEventListener("click", () => {
  $("loginForm").classList.add("hidden");
  $("signupForm").classList.remove("hidden");
  showAuthMessage("");
});

$("showLogin").addEventListener("click", () => {
  $("signupForm").classList.add("hidden");
  $("loginForm").classList.remove("hidden");
  showAuthMessage("");
});


/* =========================================
   プロフィール管理
========================================= */

async function ensureProfile(user, preferredName = "") {
  if (!user) {
    throw new Error("ログインユーザーを取得できません");
  }

  currentUser = user;

  const { data: profile, error } = await supabase
    .from("profiles")
    .select("id,display_name")
    .eq("id", user.id)
    .maybeSingle();

  if (error) {
    throw new Error("プロフィール取得エラー: " + error.message);
  }

  if (profile) {
    currentProfile = profile;
  } else {
    const displayName =
      preferredName ||
      user.user_metadata?.display_name ||
      user.user_metadata?.full_name ||
      user.email?.split("@")[0] ||
      "ユーザー";

    const { data: insertedProfile, error: insertError } =
      await supabase
        .from("profiles")
        .upsert({
          id:user.id,
          display_name:displayName
        }, {
          onConflict:"id"
        })
        .select("id,display_name")
        .single();

    if (insertError) {
      throw new Error(
        "プロフィール登録エラー: " + insertError.message
      );
    }

    currentProfile = insertedProfile;
  }

  $("headerName").textContent =
    currentProfile?.display_name || "ユーザー";
}


/* =========================================
   アプリ起動
========================================= */

async function activateSession(user, preferredName = "") {
  if (!user) {
    throw new Error("ログイン情報がありません");
  }

  // 同じユーザーの初期化を二重に実行しない
  if (appReadyUserId === user.id) {
    showAppScreen();
    return;
  }

  if (activationPromise) {
    await activationPromise;

    if (appReadyUserId === user.id) {
      showAppScreen();
      return;
    }
  }

  activationPromise = (async () => {
    try {
      currentUser = user;

      await ensureProfile(user, preferredName);

      showAppScreen();

      await loadConversations();

      appReadyUserId = user.id;

      setStatus("GATE MESSAGE / SECURE CHAT");

    } catch (error) {
      appReadyUserId = null;
      throw error;
    } finally {
      activationPromise = null;
    }
  })();

  await activationPromise;
}


/* =========================================
   ログイン
========================================= */

async function login() {
  if (!supabase) {
    showAuthMessage(
      "Supabaseに接続できません。ページを再読み込みしてください。",
      true
    );
    return;
  }

  if (loginRunning) return;

  const email = $("loginEmail").value.trim();
  const password = $("loginPassword").value;

  if (!email || !password) {
    showAuthMessage(
      "メールアドレスとパスワードを入力してください。",
      true
    );
    return;
  }

  loginRunning = true;

  const button = $("loginButton");
  button.disabled = true;
  button.textContent = "ログイン中...";

  showAuthMessage("ログインしています...");

  try {
    const { data, error } = await supabase.auth.signInWithPassword({
      email:email,
      password:password
    });

    if (error) {
      throw error;
    }

    if (!data?.session || !data?.user) {
      throw new Error("ログインセッションを取得できませんでした。");
    }

    currentUser = data.user;

    await activateSession(data.user);

    $("loginPassword").value = "";
    showAuthMessage("");

  } catch (error) {
    console.error("LOGIN ERROR:", error);

    showAuthMessage(
      "ログインできませんでした: " + error.message,
      true
    );

  } finally {
    loginRunning = false;
    button.disabled = false;
    button.textContent = "ログイン";
  }
}

$("loginButton").addEventListener("click", login);

$("loginPassword").addEventListener("keydown", event => {
  if (event.key === "Enter") {
    login();
  }
});

$("loginEmail").addEventListener("keydown", event => {
  if (event.key === "Enter") {
    $("loginPassword").focus();
  }
});


/* =========================================
   新規登録
========================================= */

async function signup() {
  if (!supabase) {
    showAuthMessage("Supabaseに接続できません。", true);
    return;
  }

  if (signupRunning) return;

  const name = $("signupName").value.trim();
  const email = $("signupEmail").value.trim();
  const password = $("signupPassword").value;

  if (!name || !email || !password) {
    showAuthMessage("すべての項目を入力してください。", true);
    return;
  }

  if (password.length < 6) {
    showAuthMessage(
      "パスワードは6文字以上にしてください。",
      true
    );
    return;
  }

  signupRunning = true;

  const button = $("signupButton");
  button.disabled = true;
  button.textContent = "登録中...";

  showAuthMessage("アカウントを作成しています...");

  try {
    const { data, error } = await supabase.auth.signUp({
      email:email,
      password:password,
      options:{
        data:{
          display_name:name,
          full_name:name
        }
      }
    });

    if (error) {
      throw error;
    }

    if (data.session && data.user) {
      await activateSession(data.user, name);
      showAuthMessage("");
    } else {
      showAuthMessage(
        "登録を受け付けました。確認メールが届いた場合は、メール認証を完了してからログインしてください。"
      );
    }

  } catch (error) {
    console.error("SIGNUP ERROR:", error);

    showAuthMessage(
      "登録に失敗しました: " + error.message,
      true
    );

  } finally {
    signupRunning = false;
    button.disabled = false;
    button.textContent = "アカウントを作成";
  }
}

$("signupButton").addEventListener("click", signup);


/* =========================================
   ユーザー検索
========================================= */

$("userSearch").addEventListener("input", () => {
  clearTimeout(searchTimer);

  const keyword = $("userSearch").value.trim();

  searchTimer = setTimeout(() => {
    searchUsers(keyword);
  }, 350);
});

async function searchUsers(keyword) {
  const results = $("searchResults");

  if (!keyword) {
    results.innerHTML = "";
    return;
  }

  if (!currentUser) return;

  results.innerHTML =
    '<div style="font-size:12px;color:#8793a6;padding:10px">検索中...</div>';

  const { data, error } = await supabase
    .from("profiles")
    .select("id,display_name")
    .neq("id", currentUser.id)
    .ilike("display_name", "%" + keyword + "%")
    .order("display_name")
    .limit(20);

  if (error) {
    console.error("USER SEARCH ERROR:", error);

    results.innerHTML =
      '<div style="font-size:12px;color:#e55364;padding:10px">検索に失敗しました: ' +
      escapeHTML(error.message) + '</div>';

    return;
  }

  if (!data || data.length === 0) {
    results.innerHTML =
      '<div style="font-size:12px;color:#8793a6;padding:10px">ユーザーが見つかりません</div>';
    return;
  }

  results.innerHTML = data.map(user => `
    <div class="user-result"
      data-user-id="${escapeHTML(user.id)}"
      data-user-name="${escapeHTML(user.display_name)}">

      <div class="avatar">
        ${escapeHTML(getInitial(user.display_name))}
      </div>

      <div class="user-result-info">
        <strong>${escapeHTML(user.display_name)}</strong>
        <small>GATE MESSAGE USER</small>
      </div>

      <span style="color:#168bcb">＋</span>
    </div>
  `).join("");

  results.querySelectorAll(".user-result").forEach(item => {
    item.addEventListener("click", () => {
      startDirectChat(
        item.dataset.userId,
        item.dataset.userName
      );
    });
  });
}


/* =========================================
   1対1トーク開始
========================================= */

async function startDirectChat(otherUserId, otherName) {
  if (!currentUser) return;

  setStatus("トークを準備しています...");

  try {
    const { data, error } = await supabase.rpc(
      "gm_start_direct_chat",
      {
        p_other_user_id:otherUserId
      }
    );

    if (error) throw error;

    if (!data) {
      throw new Error("トークIDを取得できませんでした。");
    }

    $("userSearch").value = "";
    $("searchResults").innerHTML = "";

    await loadConversations();

    await openConversation(data, otherName);

    setStatus("GATE MESSAGE / SECURE CHAT");

  } catch (error) {
    console.error("START CHAT ERROR:", error);

    alert("トークを開始できません: " + error.message);

    setStatus("GATE MESSAGE");
  }
}


/* =========================================
   トーク一覧取得
========================================= */

async function loadConversations() {
  if (!currentUser) return;

  const list = $("conversationList");

  const { data: memberships, error } = await supabase
    .from("gm_conversation_members")
    .select("conversation_id")
    .eq("user_id", currentUser.id);

  if (error) {
    console.error("MEMBERSHIP ERROR:", error);

    list.innerHTML =
      '<div style="padding:20px;color:#e55364">トーク一覧を取得できません: ' +
      escapeHTML(error.message) + '</div>';

    return;
  }

  if (!memberships || memberships.length === 0) {
    conversationsCache = [];

    list.innerHTML =
      '<div style="padding:20px;color:#8793a6;font-size:13px">まだトークはありません。<br>ユーザーを検索して会話を始めましょう。</div>';

    return;
  }

  const ids = memberships.map(x => x.conversation_id);

  const { data: conversations, error:conversationError } =
    await supabase
      .from("gm_conversations")
      .select("id,conversation_type,title,created_at")
      .in("id", ids)
      .order("created_at", {ascending:false});

  if (conversationError) {
    console.error("CONVERSATION ERROR:", conversationError);
    return;
  }

  const { data: members, error:memberError } =
    await supabase
      .from("gm_conversation_members")
      .select("conversation_id,user_id")
      .in("conversation_id", ids);

  if (memberError) {
    console.error("MEMBER ERROR:", memberError);
    return;
  }

  const otherIds = [...new Set(
    (members || [])
      .filter(m => m.user_id !== currentUser.id)
      .map(m => m.user_id)
  )];

  let profiles = [];

  if (otherIds.length) {
    const { data, error:profileError } = await supabase
      .from("profiles")
      .select("id,display_name")
      .in("id", otherIds);

    if (profileError) {
      console.error("PROFILE ERROR:", profileError);
    }

    profiles = data || [];
  }

  const { data: latestMessages, error:latestError } =
    await supabase
      .from("gm_messages")
      .select("conversation_id,content,created_at")
      .in("conversation_id", ids)
      .order("created_at", {ascending:false})
      .limit(200);

  if (latestError) {
    console.error("LATEST MESSAGE ERROR:", latestError);
  }

  conversationsCache = (conversations || []).map(conversation => {
    const conversationMembers = (members || []).filter(
      m => m.conversation_id === conversation.id
    );

    const otherMember = conversationMembers.find(
      m => m.user_id !== currentUser.id
    );

    const otherProfile = profiles.find(
      p => p.id === otherMember?.user_id
    );

    const lastMessage = (latestMessages || []).find(
      m => m.conversation_id === conversation.id
    );

    return {
      ...conversation,
      name:conversation.conversation_type === "group"
        ? conversation.title || "グループ"
        : otherProfile?.display_name || "ユーザー",
      lastMessage:lastMessage?.content || "メッセージはありません",
      lastTime:lastMessage?.created_at || conversation.created_at
    };
  });

  renderConversationList();
}


/* =========================================
   トーク一覧表示
========================================= */

function renderConversationList() {
  const list = $("conversationList");

  if (!conversationsCache.length) {
    list.innerHTML =
      '<div style="padding:20px;color:#8793a6;font-size:13px">トークはありません</div>';
    return;
  }

  list.innerHTML = conversationsCache.map(c => `
    <div class="conversation-item
      ${currentConversation === c.id ? "active" : ""}"
      data-id="${escapeHTML(c.id)}"
      data-name="${escapeHTML(c.name)}">

      <div class="avatar">
        ${escapeHTML(getInitial(c.name))}
      </div>

      <div class="conversation-info">
        <strong>${escapeHTML(c.name)}</strong>
        <small>${escapeHTML(c.lastMessage)}</small>
      </div>

      <small style="color:#9ba7b6;font-size:10px">
        ${escapeHTML(formatTime(c.lastTime))}
      </small>

    </div>
  `).join("");

  list.querySelectorAll(".conversation-item").forEach(item => {
    item.addEventListener("click", () => {
      openConversation(item.dataset.id, item.dataset.name);
    });
  });
}


/* =========================================
   トーク画面を開く
========================================= */

async function openConversation(conversationId, name) {
  currentConversation = conversationId;
  currentConversationName = name;

  $("chatEmpty").classList.add("hidden");
  $("chatContent").classList.remove("hidden");

  $("chatTitle").textContent = name;
  $("chatAvatar").textContent = getInitial(name);
  $("chatSubtitle").textContent = "GATE MESSAGE";

  $("mainLayout").classList.add("chat-open");

  renderConversationList();

  await loadMessages();

  subscribeMessages(conversationId);
}


/* =========================================
   メッセージ取得
========================================= */

async function loadMessages() {
  if (!currentConversation || !currentUser) return;

  const conversationId = currentConversation;
  const box = $("messages");

  box.innerHTML =
    '<div style="color:#8793a6;text-align:center">読み込み中...</div>';

  const { data, error } = await supabase
    .from("gm_messages")
    .select("id,conversation_id,sender_id,content,created_at")
    .eq("conversation_id", conversationId)
    .order("created_at", {ascending:true})
    .limit(500);

  if (error) {
    console.error("LOAD MESSAGES ERROR:", error);

    box.innerHTML =
      '<div style="color:#e55364;text-align:center">メッセージの取得に失敗しました: ' +
      escapeHTML(error.message) + '</div>';

    return;
  }

  // 読み込み中に別トークへ移動した場合は表示しない
  if (currentConversation !== conversationId) return;

  renderMessages(data || []);
}


/* =========================================
   メッセージ表示
========================================= */

function renderMessages(messages) {
  const box = $("messages");

  if (!messages.length) {
    box.innerHTML =
      '<div style="color:#8793a6;text-align:center;margin:auto;font-size:13px">会話を始めましょう！</div>';
    return;
  }

  box.innerHTML = messages.map(message => {
    const mine = message.sender_id === currentUser.id;

    const sender = mine
      ? currentProfile?.display_name || "自分"
      : currentConversationName;

    return `
      <div class="message-row ${mine ? "mine" : ""}">

        ${mine ? "" : `
          <div class="message-sender">
            ${escapeHTML(sender)}
          </div>
        `}

        <div class="bubble">
          ${escapeHTML(message.content)}
        </div>

        <div class="message-time">
          ${escapeHTML(formatTime(message.created_at))}
        </div>

      </div>
    `;
  }).join("");

  box.scrollTop = box.scrollHeight;
}


/* =========================================
   メッセージ送信
========================================= */

async function sendMessage() {
  if (!currentUser || !currentConversation) return;

  const input = $("messageInput");
  const button = $("sendButton");
  const content = input.value.trim();

  if (!content) return;

  if (content.length > 10000) {
    alert("メッセージは10000文字以内にしてください。");
    return;
  }

  const conversationId = currentConversation;

  button.disabled = true;

  try {
    const { error } = await supabase
      .from("gm_messages")
      .insert({
        conversation_id:conversationId,
        sender_id:currentUser.id,
        content:content
      });

    if (error) throw error;

    input.value = "";

    if (currentConversation === conversationId) {
      await loadMessages();
    }

    await loadConversations();

  } catch (error) {
    console.error("SEND MESSAGE ERROR:", error);
    alert("送信に失敗しました: " + error.message);

  } finally {
    button.disabled = false;
    input.focus();
  }
}

$("sendButton").addEventListener("click", sendMessage);

$("messageInput").addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});


/* =========================================
   リアルタイム受信
========================================= */

function unsubscribeMessages() {
  if (messageSubscription && supabase) {
    supabase.removeChannel(messageSubscription);
  }

  messageSubscription = null;
}

function subscribeMessages(conversationId) {
  unsubscribeMessages();

  messageSubscription = supabase
    .channel("gm-chat-" + conversationId)
    .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"gm_messages",
        filter:"conversation_id=eq." + conversationId
      },
      async payload => {
        if (currentConversation !== conversationId) return;

        if (payload.new?.sender_id === currentUser?.id) return;

        await loadMessages();
        await loadConversations();
      }
    )
    .subscribe(status => {
      if (status === "CHANNEL_ERROR") {
        console.error("Realtime channel error:", conversationId);

        setStatus(
          "リアルタイム接続に問題があります。再読み込みしてください。"
        );
      }
    });
}


/* =========================================
   戻る
========================================= */

$("backButton").addEventListener("click", () => {
  $("mainLayout").classList.remove("chat-open");

  unsubscribeMessages();

  currentConversation = null;
  currentConversationName = "";

  $("chatContent").classList.add("hidden");
  $("chatEmpty").classList.remove("hidden");

  renderConversationList();
});


/* =========================================
   ログアウト
========================================= */

$("logoutButton").addEventListener("click", async () => {
  if (!confirm("ログアウトしますか？")) return;

  signingOut = true;
  unsubscribeMessages();

  try {
    const { error } = await supabase.auth.signOut();

    if (error) throw error;

    currentUser = null;
    currentProfile = null;
    currentConversation = null;
    currentConversationName = "";
    appReadyUserId = null;
    conversationsCache = [];

    $("conversationList").innerHTML = "";
    $("messages").innerHTML = "";
    $("userSearch").value = "";
    $("searchResults").innerHTML = "";

    showLoginScreen("ログアウトしました。");

  } catch (error) {
    console.error("LOGOUT ERROR:", error);

    alert("ログアウトに失敗しました: " + error.message);

  } finally {
    signingOut = false;
  }
});


/* =========================================
   認証状態の監視
========================================= */

if (supabase) {
  supabase.auth.onAuthStateChange((event, session) => {

    // Supabaseの認証コールバック内でDB処理を直接実行しない
    setTimeout(async () => {
      if (session?.user) {
        if (appReadyUserId !== session.user.id) {
          try {
            await activateSession(session.user);
          } catch (error) {
            console.error(
              "AUTH STATE INITIALIZATION ERROR:",
              error
            );

            showLoginScreen(
              "ログイン後の初期化に失敗しました: " + error.message
            );
          }
        }
      } else if (!signingOut) {
        currentUser = null;
        currentProfile = null;
        currentConversation = null;
        currentConversationName = "";
        appReadyUserId = null;

        unsubscribeMessages();

        showLoginScreen("");
      }
    }, 0);
  });


  /* =======================================
     ページ読み込み時のログイン状態確認
  ======================================= */

  (async function initializePage() {
    try {
      const { data, error } = await supabase.auth.getSession();

      if (error) throw error;

      if (data?.session?.user) {
        await activateSession(data.session.user);
      } else {
        showLoginScreen("");
      }

    } catch (error) {
      console.error("INITIAL SESSION ERROR:", error);

      showLoginScreen(
        "ログイン状態を確認できませんでした: " + error.message
      );
    }
  })();

} else {
  showAuthMessage(
    "Supabaseの読み込みに失敗しました。インターネット接続を確認してページを再読み込みしてください。",
    true
  );
}
</script>
